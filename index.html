<!DOCTYPE html>
<html lang="fr">
<head>

<meta http-equiv="Content-Security-Policy" content="
 default-src 'self';

 connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh;
 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
 font-src https://fonts.gstatic.com;
 img-src 'self' data:;
 form-action 'none';
 base-uri 'self';
 object-src 'none';
 frame-ancestors 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Suivi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Mon Suivi CrossFit</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Raleway:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input,textarea,label,.chip,.tab,.gtab button,.step-btn{touch-action:manipulation}
:root{ /* « Mon Suivi CrossFit » — thème sombre par défaut */
  --cloud:#0D0F12;--card:#1A1F26;--sunk:#12161B;--ink:#FFFFFF;--mute:#96A2AE;--line:#2A313A;
  --aqua:#33D6B0;--orchid:#8B7BD8;--melon:#F2C14E;--alex:#33D6B0;--lava:#E4614F;
  --track:#242B34;--seg0:#4A5560;--barbar:#7C8894;--onacc:#0B1013;
  --sh:0 1px 0 rgba(255,255,255,.03),0 14px 34px -20px rgba(0,0,0,.9);
  --sh-lo:0 1px 0 rgba(255,255,255,.02),0 8px 20px -16px rgba(0,0,0,.8);
}
:root[data-theme="light"]{ --cloud:#F4F5F6;--card:#FFFFFF;--sunk:#EEF0F2;--ink:#12161B;--mute:#5E6B76;--line:#DFE3E7;
  --aqua:#0B7C64;--orchid:#6D5BB5;--melon:#9A6A12;--alex:#0B7C64;--lava:#B93B2A;
  --track:#E2E6EA;--seg0:#C3CAD1;--barbar:#98A3AD;--onacc:#FFFFFF;
  --sh:0 1px 2px rgba(18,22,27,.05),0 12px 30px -18px rgba(18,22,27,.28);
  --sh-lo:0 1px 2px rgba(18,22,27,.04),0 6px 16px -14px rgba(18,22,27,.22); }
@media (prefers-color-scheme:light){ :root[data-theme="auto"]{ --cloud:#F4F5F6;--card:#FFFFFF;--sunk:#EEF0F2;--ink:#12161B;--mute:#5E6B76;--line:#DFE3E7;
  --aqua:#0B7C64;--orchid:#6D5BB5;--melon:#9A6A12;--alex:#0B7C64;--lava:#B93B2A;
  --track:#E2E6EA;--seg0:#C3CAD1;--barbar:#98A3AD;--onacc:#FFFFFF;
  --sh:0 1px 2px rgba(18,22,27,.05),0 12px 30px -18px rgba(18,22,27,.28);
  --sh-lo:0 1px 2px rgba(18,22,27,.04),0 6px 16px -14px rgba(18,22,27,.22); } }
::selection{background:rgba(51,214,176,.3)}
html,body{background:var(--cloud)}
body{font-family:Raleway,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(98px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2.5px solid var(--aqua);outline-offset:2px}
.dsp{font-family:Montserrat,Raleway,sans-serif;font-weight:700;letter-spacing:-.015em;line-height:1.02}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:600}
.head{padding:calc(30px + env(safe-area-inset-top)) 22px 10px}
.head h1{font-family:Montserrat,sans-serif;font-weight:700;font-size:38px;letter-spacing:-.032em;line-height:.94;margin-top:5px}
.pane{padding:0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.card.flat{box-shadow:none;background:var(--sunk);border:1px solid var(--line)}
.btn{display:block;width:100%;padding:17px;border-radius:16px;font-weight:600;font-size:15px;text-align:center;transition:transform .12s,opacity .12s}
.btn-go{background:var(--aqua);color:var(--onacc);box-shadow:0 8px 24px -16px var(--aqua)}
.btn-go:active{transform:scale(.985)}
.btn-go[disabled]{opacity:.32}
.btn-quiet{background:var(--sunk);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn-quiet:active{transform:scale(.99);background:var(--card)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);
  font-size:13.5px;font-weight:500;color:var(--mute);box-shadow:none}
.chip.on{background:var(--aqua);border-color:var(--aqua);color:var(--onacc);font-weight:700}
.chip.on-a{background:var(--aqua);border-color:var(--aqua);color:var(--onacc);font-weight:700}
/* Frise des semaines */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:252px;margin:0 auto}
.gcell{aspect-ratio:1;border-radius:5px;background:var(--track);animation:pop .3s backwards}
.gcell.on{background:var(--aqua)}
.gcell.ms{background:var(--melon)}
.gcell.today{box-shadow:inset 0 0 0 1.5px var(--mute)}
.gcell.pick{box-shadow:inset 0 0 0 2px var(--ink)}
.gcell:disabled{opacity:1}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.glabel{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 auto 6px;max-width:252px}
.glabel span{text-align:center;font-size:9.5px;color:var(--mute);font-weight:600}
.legend{display:flex;gap:14px;margin-top:12px;justify-content:center;font-size:11px;color:var(--mute);font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 6px;text-align:center}
.stat b{display:block;font-family:Montserrat,sans-serif;font-weight:700;font-size:29px;letter-spacing:-.03em}
.stat span{font-size:10.5px;color:var(--mute);font-weight:500;line-height:1.3;display:block;margin-top:4px}
.scroll{display:flex;gap:11px;overflow-x:auto;padding:4px 22px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.ms-card{flex:none;width:178px;border-radius:19px;padding:16px;scroll-snap-align:start;color:var(--onacc);box-shadow:var(--sh)}
.ms-card b{display:block;font-family:Montserrat,sans-serif;font-weight:700;font-size:15.5px;line-height:1.18;margin:10px 0 7px;letter-spacing:-.015em}
.ms-card small{font-size:11px;opacity:.85;font-weight:500}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(127,127,127,.22)}
.rung{display:flex;align-items:center;gap:13px;padding:7px 0;position:relative}
.rdot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:var(--sunk);flex:none;z-index:1}
.rung.done .rdot{background:var(--aqua);border-color:var(--aqua)}
.rung.now .rdot{background:var(--melon);border-color:var(--melon);box-shadow:0 0 0 5px rgba(242,193,78,.22)}
.rline{position:absolute;left:6.5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.rung span{font-size:13.5px;color:var(--mute)}
.rung.done span{color:var(--ink)}
.rung.now span{color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;gap:11px}
.step-btn{width:56px;height:56px;flex:none;border-radius:17px;background:var(--sunk);border:1px solid var(--line);
  font-size:23px;font-weight:500;display:grid;place-items:center;color:var(--ink)}
.step-btn:active{background:var(--card)}
.step-val{flex:1;text-align:center;min-width:0}
.step-val input{width:100%;min-width:0;background:none;border:none;text-align:center;color:var(--ink);
  font-family:Montserrat,sans-serif;font-weight:700;font-size:44px;letter-spacing:-.035em}
.step.sm{gap:7px}
.step.sm .step-btn{width:46px;height:46px;border-radius:14px;font-size:20px}
.step.sm .step-val input{font-size:clamp(22px,7.5vw,32px)}
.step.sm .eyebrow{font-size:9.5px;letter-spacing:.09em}
.srow{display:flex;align-items:center;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:none}
.sin{width:100%;min-width:0;padding:10px 4px;text-align:center;border:1px solid var(--line);
  border-radius:12px;background:var(--sunk);font-family:inherit;font-weight:600;font-size:16px;color:var(--ink)}
.sin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sunit{font-size:11px;color:var(--mute);font-weight:500;flex:none}
.sdiff{padding:8px 9px;border-radius:999px;border:1px solid var(--line);font-size:10.5px;
  font-weight:600;color:var(--mute);background:var(--sunk);flex:none;white-space:nowrap}
.se1{font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;color:var(--mute);
  flex:none;min-width:38px;text-align:right}
.se1.best{color:var(--melon)}
.step-val input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp{width:100%;padding:14px;background:var(--sunk);border:1px solid var(--line);border-radius:15px;
  color:var(--ink);font-size:16px;font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:none}
.pill{width:26px;height:26px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;
  font-size:12px;font-weight:600;color:var(--mute);flex:none}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:flex;gap:6px;padding:9px 16px calc(11px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--cloud) 90%,transparent);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:40}
.tab{flex:1;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
 font-size:10.5px;font-weight:600;color:var(--mute);border-radius:14px;letter-spacing:.01em}
.tab.on{background:transparent;color:var(--aqua)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end}
.sheet-in{background:var(--card);border:1px solid var(--line);border-bottom:none;width:100%;max-width:520px;margin:0 auto;max-height:88vh;
  border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.7)}
.mv{width:100%;padding:14px 2px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.mv small{color:var(--mute);font-size:11.5px}
.empty{text-align:center;padding:38px 24px;color:var(--mute);font-size:14px;line-height:1.68}
.badge{font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
  background:var(--sunk);border:1px solid var(--line);color:var(--mute);font-weight:600;white-space:nowrap}
.badge.hot{background:var(--melon);border-color:var(--melon);color:var(--onacc)}
.gtab{display:grid;gap:5px;padding:2px 0 4px}
.gtab button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
 min-width:0;padding:10px 2px 9px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);
 font-size:9.5px;font-weight:600;color:var(--mute);letter-spacing:.01em;line-height:1;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtab button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gtab button.on{background:var(--aqua);border-color:var(--aqua);color:var(--onacc);font-weight:700}
.gtab svg{opacity:.9;flex:none}
.lvbar{display:flex;gap:4px;margin-bottom:8px}
.lvseg{flex:1;height:10px;border-radius:5px;background:var(--track)}
.lvnames{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);font-weight:500}
.lvnames span{flex:1;text-align:center}
.hero-n{font-family:Montserrat,sans-serif;font-weight:700;font-size:44px;letter-spacing:-.04em;line-height:.86}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Tablette et ordinateur : colonne plus large, navigation en haut */
@media (min-width:820px){
 #app{max-width:660px;padding-bottom:40px;padding-top:64px}
 .tabs{top:0;bottom:auto;max-width:660px;border-top:none;border-bottom:1px solid var(--line);
  padding:10px 18px;border-radius:0 0 20px 20px}
 #overlay .sheet{align-items:center}
 .head{padding-top:26px}
 .head h1{font-size:44px}
 .scroll{padding-left:22px;padding-right:22px}
 .sheet-in{border-radius:24px;margin-bottom:6vh;max-width:560px}
 .sheet{align-items:center}
}
@media (min-width:1200px){#app{max-width:720px}.tabs{max-width:720px}}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mute);font-weight:500}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.sync.ok i{background:var(--alex)}.sync.err i{background:var(--lava)}
.sync.pending i{background:var(--melon);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.3}}
</style>
</head>

function ageFactor(a){if(a<20)return Math.max(.85,1-.02*(20-a));
 if(a<=30)return 1;return Math.max(.6,1-.0075*(a-30))}
function stdFor(id,p){
 if(!p||!p.bw||!p.age)return null;
 const s=p.sex==="m"?"m":"f",ref=s==="m"?80:65,af=ageFactor(p.age);
 if(RATIO[id]&&RATIO[id][s]){const k=Math.pow(ref/p.bw,.25);
  return{unit:"kg",t:RATIO[id][s].map(x=>+(x*p.bw*k*af).toFixed(1))}}
 if(REPSTD[id]&&REPSTD[id][s]){const k=NOBW.includes(id)?1:Math.pow(ref/p.bw,.6);
  return{unit:"reps",t:REPSTD[id][s].map(x=>Math.max(1,Math.round(x*k*af)))}}
 return null}
function levelValue(id){
 if(RATIO[id])return bestOf(id);
 if(REPSTD[id]){const rx=RX[id]??0;let b=0;
  eachSet(id,x=>{if(!x.weight&&(x.level==null||x.level>=rx)&&x.reps>b)b=x.reps});return b||null}
 return null}
function levelInfo(v,t,names){
 let idx=-1;for(let i=0;i<5;i++)if(v>=t[i])idx=i;
 const segs=[];for(let i=0;i<5;i++){
  if(i<=idx)segs.push(1);
  else if(i===idx+1){const lo=idx<0?0:t[idx];segs.push(Math.max(0,Math.min(1,(v-lo)/(t[i]-lo))))}
  else segs.push(0)}
 return{label:idx<0?"En route":names[idx],idx,segs,
  next:idx<4?{name:names[idx+1],need:t[idx+1]-v}:null}}

/* ══════════ LOGIQUE ══════════ */
const rirOf=d=>(DIFFS.find(x=>x.k===d)||DIFFS[1]).rir;
/* Epley sur répétitions effectives (reps + réserve estimée).
   Au-delà de 8 reps effectives l'estimation n'a plus de valeur : on ne calcule pas. */
function e1rm(w,r,d){const e=(r||0)+rirOf(d);return(!w||w<=0||!r||e>8)?null:w*(1+e/30)}
const rnd=n=>Math.round(n*100)/100,uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const t=new Date(d);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)};
const TODAY=iso(new Date());
const fLong=s=>new Date(s+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fMid=s=>new Date(s+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const fSh=s=>new Date(s+"T12:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
const mmss=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function loadout(t,b){const p=(t-b)/2;if(p<0)return null;const o=[];let r=rnd(p);
 for(const x of PLATES){while(r>=x.w-.001){o.push(x);r=rnd(r-x.w)}}return{plates:o,left:r}}
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
function streak(ss){if(!ss.length)return 0;const w=new Set(ss.map(s=>monday(s.date+"T12:00")));
 let c=0,cur=new Date();cur.setDate(cur.getDate()-((cur.getDay()+6)%7));
 if(!w.has(iso(cur)))cur.setDate(cur.getDate()-7);
 while(w.has(iso(cur))){c++;cur.setDate(cur.getDate()-7)}return c}
function weeksGrid(n){const rows=[],m=new Date();m.setDate(m.getDate()-((m.getDay()+6)%7));
 for(let w=n-1;w>=0;w--){const s=new Date(m);s.setDate(s.getDate()-w*7);const d=[];
 for(let i=0;i<7;i++){const x=new Date(s);x.setDate(x.getDate()+i);d.push(iso(x))}rows.push(d)}return rows}

function eachSet(id,fn){S.sessions.forEach(s=>(s.entries||[]).filter(e=>e.movementId===id)
 .forEach(e=>(e.sets||[]).forEach(x=>fn(x,s))))}
function bestOf(id){let b=null;eachSet(id,x=>{const v=e1rm(x.weight,x.reps,x.diff);if(v&&(!b||v>b))b=v});return b}

function milestones(ss){const out=[],seen=new Set(),mx={},rm={},rp={};
 [...ss].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>(s.entries||[]).forEach(e=>{
  const m=mv(e.movementId);
  if(!seen.has(m.id)){seen.add(m.id);out.push({date:s.date,t:"Découvert",v:m.n,id:m.id})}
  (e.sets||[]).forEach(st=>{
   if(m.lad&&st.level!=null&&(mx[m.id]==null||st.level>mx[m.id])){
    const first=mx[m.id]==null;mx[m.id]=st.level;
    if(!first||st.level>0)out.push({date:s.date,t:"Nouveau palier",v:m.n+" — "+m.lad[st.level],id:m.id})}
   const v=e1rm(st.weight,st.reps,st.diff);
   if(v){if(rm[m.id]&&v>rm[m.id]+.4)out.push({date:s.date,t:"Record",v:m.n+" — "+v.toFixed(1)+" kg",id:m.id});
    if(!rm[m.id]||v>rm[m.id])rm[m.id]=v}
   else if(!st.weight&&st.reps&&m.k==="gym"){
    if(rp[m.id]&&st.reps>rp[m.id])out.push({date:s.date,t:"Record",v:m.n+" — "+st.reps+" "+(m.u==="sec"?"s":"reps")+" d'affilée",id:m.id});
    if(!rp[m.id]||st.reps>rp[m.id])rp[m.id]=st.reps}})}));
 return out.reverse()}

/* Grille du mois : 6 lignes de 7 cases, les jours hors mois restent vides */
function monthGrid(off){
 const now=new Date(), base=new Date(now.getFullYear(), now.getMonth()+off, 1);
 const y=base.getFullYear(), mo=base.getMonth();
 const first=(new Date(y,mo,1).getDay()+6)%7;          // lundi = 0
 const nb=new Date(y,mo+1,0).getDate();
 const cells=[];
 for(let i=0;i<first;i++)cells.push(null);
 for(let d=1;d<=nb;d++)cells.push(iso(new Date(y,mo,d)));
 while(cells.length%7)cells.push(null);
 return{y,mo,label:MOIS[mo]+" "+y,cells,
  from:iso(new Date(y,mo,1)),to:iso(new Date(y,mo,nb))}}

/* Chiffres d'une période */
function statsRange(from,to){
 const ss=S.sessions.filter(s=>s.date>=from&&s.date<=to);
 let vol=0;
 ss.forEach(x=>{(x.entries||[]).forEach(e=>(e.sets||[]).forEach(y=>{
   vol+=y.dist?Math.round(y.dist/50):(y.reps||0)}));
  (x.metcons||[]).forEach(mc=>mcTotals(mc).forEach(t=>vol+=t.reps+Math.round(t.dist/50)+t.cal))});
 const ms=milestones(S.sessions).filter(m=>m.date>=from&&m.date<=to);
 return{n:ss.length,vol,ms:ms.length,rec:ms.filter(m=>m.t==="Record").length}}

/* Une phrase d'accueil tirée des données réelles, jamais culpabilisante */
function accroche(){
 const G=(f,m)=>S.profile&&S.profile.sex==="f"?f:m;
 const ms=milestones(S.sessions), st=streak(S.sessions);
 const der=sorted()[0];
 const jours=der?Math.round((new Date(TODAY)-new Date(der.date))/864e5):null;
 const recent=ms.find(m=>(new Date(TODAY)-new Date(m.date))/864e5<=7);
 if(jours===0)return["Séance notée aujourd'hui.","C'est dans la boîte."];
 if(recent)return[recent.t==="Record"?"Nouveau record cette semaine.":"Une première fois cette semaine.",esc(recent.v).replace(/\.$/,"")+"."];
 if(st>=2)return[st+" semaines d'affilée.","Le rythme est installé."];
 if(jours!=null&&jours<=3)return["Dernière séance il y a "+jours+" jour"+(jours>1?"s":"")+".","À toi de jouer quand tu veux."];
 if(jours!=null)return["Dernière séance le "+fMid(der.date).replace(/\.$/,"")+".","Reprends quand ça t'arrange."];
 return["Bienvenue.","Ta première séance t'attend."]}

    ${st>0?`<div style="flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:0 15px;border:1px solid var(--line);border-radius:16px">
      <b style="font-size:19px;font-family:Montserrat,sans-serif">${st}</b>
      <span style="font-size:9.5px;color:var(--mute);font-weight:600;letter-spacing:.04em">SEM.</span></div>`:""}
   </div></div>`;

  /* ─── Bloc calendrier, trois vues au choix ─── */
  const vue=S.hv||"mois";
  h+=`<div class="card" style="padding:16px 16px 14px">
   <div class="gtab" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:14px">`+
   [["mois","Mois"],["semaines","Semaines"],["annee","Année"]].map(([k,l])=>
    `<button class="${vue===k?"on":""}" data-act="hv" data-v="${k}"><span>${l}</span></button>`).join("")+`</div>`;

  if(vue==="mois"){
   const g=monthGrid(S.moff||0), sm=statsRange(g.from,g.to);
   h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button class="chip" style="padding:7px 12px" data-act="moff" data-v="-1">‹</button>
    <b style="font-size:14.5px;text-transform:capitalize">${g.label}</b>
    <button class="chip" style="padding:7px 12px;${(S.moff||0)>=0?"opacity:.35":""}" data-act="moff" data-v="1">›</button></div>
    <div class="glabel" style="max-width:none">${["L","M","M","J","V","S","D"].map(d=>`<span>${d}</span>`).join("")}</div>`;
   for(let i=0;i<g.cells.length;i+=7){
    h+=`<div class="grid" style="max-width:none;margin-bottom:4px">`+g.cells.slice(i,i+7).map(d=>{
     if(!d)return`<div style="aspect-ratio:1"></div>`;
     const c=msDays.has(d)?"ms":days.has(d)?"on":"";
     const jour=+d.slice(8);
     return`<button class="gcell ${c}${d===TODAY?" today":""}${S.day===d?" pick":""}"
      data-act="day" data-v="${d}" style="display:flex;align-items:center;justify-content:center;
      font-size:10.5px;font-weight:600;color:${c?"var(--onacc)":"var(--mute)"}">${jour}</button>`}).join("")+`</div>`}
   h+=`<div class="legend" style="margin-top:11px"><span><i style="background:var(--aqua)"></i>séance</span>
    <span><i style="background:var(--melon)"></i>première fois</span></div>
    <div style="display:flex;gap:6px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">
    <div style="flex:1;text-align:center"><b style="font-family:Montserrat,sans-serif;font-size:18px">${sm.n}</b>
     <div style="font-size:10px;color:var(--mute);font-weight:600;margin-top:2px">SÉANCES</div></div>
    <div style="flex:1;text-align:center"><b style="font-family:Montserrat,sans-serif;font-size:18px">${sm.vol.toLocaleString("fr-FR")}</b>
     <div style="font-size:10px;color:var(--mute);font-weight:600;margin-top:2px">MOUVEMENTS</div></div>
    <div style="flex:1;text-align:center"><b style="font-family:Montserrat,sans-serif;font-size:18px">${sm.ms}</b>
     <div style="font-size:10px;color:var(--mute);font-weight:600;margin-top:2px">PREMIÈRES FOIS</div></div></div>`;
  }

  if(vue==="semaines"){
   const wks=[],m0=new Date();m0.setDate(m0.getDate()-((m0.getDay()+6)%7));
   for(let i=7;i>=0;i--){const st1=new Date(m0);st1.setDate(st1.getDate()-i*7);
    const en=new Date(st1);en.setDate(en.getDate()+6);
    const a=iso(st1),b=iso(en),r=statsRange(a,b);
    wks.push({...r,label:fSh(a).slice(0,5)})}
   const mx=Math.max(1,...wks.map(w=>w.vol));
   h+=`<div style="display:flex;align-items:flex-end;gap:6px;height:96px">`+
    wks.map((w,i)=>`<div style="flex:1;text-align:center">
     <div style="height:${Math.max(3,w.vol/mx*74)}px;border-radius:5px 5px 2px 2px;
      background:${i===7?"var(--aqua)":"var(--track)"}"></div>
     <div style="font-size:9.5px;color:var(--mute);margin-top:5px;font-weight:600">${w.n||"–"}</div></div>`).join("")+
    `</div><div style="font-size:11px;color:var(--mute);text-align:center;margin-top:3px">séances par semaine, sur 8 semaines</div>
    <div style="font-size:13px;color:var(--mute);line-height:1.6;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">
    Cette semaine : <b style="color:var(--ink)">${wks[7].vol.toLocaleString("fr-FR")}</b> mouvements${
     wks[6].vol?` — la précédente, ${wks[6].vol.toLocaleString("fr-FR")}`:""}.</div>`;
  }

  if(vue==="annee"){
   const mos=[];
   for(let i=11;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    const from=iso(new Date(d.getFullYear(),d.getMonth(),1));
    const to=iso(new Date(d.getFullYear(),d.getMonth()+1,0));
    mos.push({...statsRange(from,to),label:MOIS[d.getMonth()].slice(0,3),m:d.getMonth()})}
   const mx=Math.max(1,...mos.map(x=>x.n));
   h+=`<div style="display:flex;align-items:flex-end;gap:4px;height:100px">`+
    mos.map((x,i)=>`<div style="flex:1;text-align:center">
     <div style="height:${Math.max(3,x.n/mx*76)}px;border-radius:4px 4px 2px 2px;
      background:${i===11?"var(--aqua)":"var(--track)"}"></div>
     <div style="font-size:8.5px;color:var(--mute);margin-top:5px;font-weight:600">${x.label}</div></div>`).join("")+
    `</div><div style="font-size:13px;color:var(--mute);line-height:1.6;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">
    <b style="color:var(--ink)">${mos.reduce((a,x)=>a+x.n,0)}</b> séances sur douze mois,
    dont <b style="color:var(--ink)">${mos.reduce((a,x)=>a+x.rec,0)}</b> avec un record.</div>`;
  }
  h+=`</div>`;

  /* ─── Détail du jour sélectionné ─── */
  if(S.day){
   const dss=S.sessions.filter(x=>x.date===S.day);
   h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${dss.length?"12px":"0"}">
    <b style="font-size:14.5px;text-transform:capitalize">${fLong(S.day)}</b>
    <button class="chip" style="padding:6px 11px" data-act="dayclose">Fermer</button></div>`;
   if(!dss.length)h+=`<div style="font-size:13.5px;color:var(--mute)">Aucune séance ce jour-là.</div>`;
   dss.forEach(x=>{
    const movs=[...new Set([...(x.entries||[]).map(e=>mv(e.movementId).n),
      ...(x.metcons||[]).flatMap(mc=>mcTotals(mc).map(t=>t.n))])];
    h+=`<button style="width:100%;text-align:left;border-top:1px solid var(--line);padding:12px 0"
     data-act="openday" data-v="${x.id}">
     <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
     <span style="font-size:13.5px;color:var(--mute);flex:1">${movs.slice(0,4).map(esc).join(" · ")}${movs.length>4?" +"+(movs.length-4):""}</span>
     <span style="color:var(--mute);font-size:17px">›</span></div>
     <div style="font-size:12px;color:var(--mute);margin-top:5px">${(x.entries||[]).length} mouvement${(x.entries||[]).length>1?"s":""}${
      (x.metcons||[]).length?` · ${(x.metcons||[]).length} metcon`:""}</div></button>`});
   h+=`</div>`}

  if(ms.length){h+=`<div class="pane" style="padding-bottom:0"><div class="eyebrow" style="margin-bottom:11px">Premières fois</div></div>
   <div class="scroll">`+ms.slice(0,12).map(x=>`<button class="ms-card" style="background:${MSC[x.t]};text-align:left"
   ${x.id?`data-act="fiche" data-v="${x.id}"`:""}>
   <span class="tag">${x.t}</span><b>${esc(x.v)}</b>
   <small style="display:flex;justify-content:space-between;align-items:center">${fMid(x.date)}${x.id?'<span style="font-size:15px;opacity:.7">›</span>':""}</small></button>`).join("")+`</div><div style="height:16px"></div>`}

  h+=benchCard();
  const inE=[...new Set(S.sessions.flatMap(s=>(s.entries||[]).filter(e=>e.sets&&e.sets.length).map(e=>e.movementId)))];
  const inM=[...new Set(S.sessions.flatMap(s=>(s.metcons||[]).flatMap(mc=>mcTotals(mc).map(t=>t.id))))];
  const used=[...inE,...inM.filter(x=>!inE.includes(x))];
  if(used.length){
   /* Familles ordonnées, puis liste des mouvements de la famille retenue. */
   const ORDER=["Haltéro","Force","Haltères","Gymnastique","Cardio","Mes mouvements"];
   const rank=g=>{const i=ORDER.indexOf(g);return i<0?99:i};
   const groups=[...new Set(used.map(id=>mv(id).g))].sort((a,b)=>rank(a)-rank(b));
   const gSel=S.progG&&groups.includes(S.progG)?S.progG:groups[0];
   let inG=used.filter(id=>mv(id).g===gSel);

   /* Filtre texte, proposé seulement quand la liste devient longue */
   const q=(S.mq||"").toLowerCase().trim();
   const longue=inG.length>8;
   if(q)inG=inG.filter(id=>mv(id).n.toLowerCase().includes(q));

   /* Tri : par défaut les plus récemment travaillés remontent */
   const tri=S.msort||"recent";
   const lastUse={};
   S.sessions.forEach(s2=>{
    const t=[...(s2.entries||[]).map(e=>e.movementId),...(s2.metcons||[]).flatMap(mc=>mcTotals(mc).map(x=>x.id))];
    t.forEach(id=>{if(!lastUse[id]||s2.date>lastUse[id])lastUse[id]=s2.date})});
   const cnt={};
   S.sessions.forEach(s2=>{
    const t=new Set([...(s2.entries||[]).map(e=>e.movementId),...(s2.metcons||[]).flatMap(mc=>mcTotals(mc).map(x=>x.id))]);
    t.forEach(id=>cnt[id]=(cnt[id]||0)+1)});
   inG=[...inG].sort((a,b)=>
    tri==="alpha"?mv(a).n.localeCompare(mv(b).n,"fr")
    :tri==="freq"?(cnt[b]||0)-(cnt[a]||0)||mv(a).n.localeCompare(mv(b).n,"fr")
    :(lastUse[b]||"").localeCompare(lastUse[a]||"")||mv(a).n.localeCompare(mv(b).n,"fr"));

   h+=`<div class="pane"><div class="eyebrow" style="margin-bottom:11px">Mes mouvements</div>
    <div class="gtab" style="grid-template-columns:repeat(${groups.length},minmax(0,1fr))">`+
    groups.map(g=>`<button class="${gSel===g?"on":""}" data-act="progg" data-v="${esc(g)}"
     title="${esc(g)}">${gicon(g)}<span>${GSHORT[g]||g}</span></button>`).join("")+`</div>`;

   if(longue||q)h+=`<input class="inp" id="mq" style="margin-top:10px;padding:11px 14px;font-size:14px"
    placeholder="Filtrer dans ${esc(GSHORT[gSel]||gSel)}…" value="${esc(S.mq||"")}">`;

   h+=`<div class="chips" style="margin:10px 0 12px">`+
    [["recent","Récents"],["freq","Les plus faits"],["alpha","A → Z"]].map(([k,l])=>
     `<button class="chip" style="padding:7px 12px;font-size:12px;${tri===k?"font-weight:700;color:var(--ink);border-color:var(--ink)":""}"
      data-act="msort" data-v="${k}">${l}</button>`).join("")+`</div>`;

   if(!inG.length)h+=`<div class="card"><div style="font-size:13.5px;color:var(--mute)">Aucun mouvement ne correspond.</div></div>`;
   else h+=`<div class="card" style="padding:4px 16px">`+inG.map((id,i)=>{
    const m2=mv(id),st2=movStat(id);
    return`<button style="width:100%;display:flex;align-items:center;gap:12px;padding:13px 0;text-align:left;
     ${i?"border-top:1px solid var(--line)":""}" data-act="fiche" data-v="${id}">
     <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m2.n)}</div>
      <div style="font-size:11.5px;color:var(--mute);margin-top:3px">${st2.sub}</div></div>
     ${st2.txt?`<span class="dsp" style="font-size:17px;white-space:nowrap">${st2.txt}</span>`:""}
     <span style="color:var(--mute);font-size:17px;flex:none">›</span></button>`}).join("")+`</div>`;
   h+=`</div>`}

  return h+patternCard()+`<div class="pane"><button class="btn btn-go" style="margin-bottom:24px" data-act="new">Noter une séance</button></div>`}

/* Chiffre clé d'un mouvement pour l'affichage en liste */
function movStat(id){
 const m=mv(id),isCar=m.k==="cardio"||PACE[id];
 const best=bestOf(id),c=curveFor(id);
 const nb=c.length;
 const dernier=nb?c[nb-1].date:null;
 const sub=nb?`${nb} séance${nb>1?"s":""} · dernière ${fMid(dernier)}`:"vu en metcon";
 if(best!=null)return{txt:best.toFixed(1)+" kg",sub};
 const wp=c.filter(x=>x.pace!=null);
 if(isCar&&wp.length)return{txt:mmss(Math.min(...wp.map(x=>x.pace))),sub};
 const wn=c.filter(x=>x.reps>0);
 if(wn.length)return{txt:Math.max(...wn.map(x=>x.reps))+(m.u==="sec"?" s":m.u==="m"?" m":" reps"),sub};
 return{txt:"",sub}}

/* ══════════ FICHE MOUVEMENT ══════════ */
function vFiche(id){
 const m=mv(id),isCar=m.k==="cardio"||PACE[id];
 const curve=curveFor(id),hist=histFor(id);
 const wr=curve.filter(c=>c.rm!=null),wp=curve.filter(c=>c.pace!=null),wn=curve.filter(c=>c.reps>0);
 const best=bestOf(id);
 let h=`<div class="head" style="padding-bottom:12px">
  <button class="chip" style="margin-bottom:14px" data-act="fclose">← Progrès</button>
  <div class="eyebrow">${esc(m.g)}</div><h1 style="font-size:34px">${esc(m.n)}</h1></div><div class="pane">`;

 /* Chiffre principal */
 let hero=null;
 if(best!=null)hero=["Charge max estimée",best.toFixed(1),"kg"];
 else if(isCar&&wp.length)hero=["Meilleure allure",mmss(Math.min(...wp.map(c=>c.pace))),"/ "+(PACE[id]||500)+" m"];
 else if(wn.length)hero=["Meilleure série",Math.max(...wn.map(c=>c.reps)),m.u==="sec"?"s":m.u==="m"?"m":"reps"];
 if(hero)h+=`<div class="card"><div class="eyebrow">${hero[0]}</div>
  <div class="dsp" style="font-size:46px;margin-top:6px">${hero[1]}<span style="font-size:17px;color:var(--mute);font-weight:500"> ${hero[2]}</span></div>
  ${volLine(id)}</div>`;

 /* Courbe d'évolution */
 const src=wr.length>1?[wr,"rm"," kg",false]:wp.length>1?[wp,"pace","",true]
  :wn.length>1?[wn,"reps"," "+(m.u==="sec"?"s":m.u==="m"?"m":"reps"),false]:null;
 h+=`<div class="card"><div class="eyebrow" style="margin-bottom:12px">${
  src&&src[1]==="rm"?"Évolution de la charge max estimée":src&&src[1]==="pace"?"Évolution de l'allure":"Évolution de la meilleure série"}</div>`;
 h+=src?chart(src[0],src[1],src[2],src[3])
  :`<div style="font-size:13.5px;color:var(--mute);line-height:1.65">Il faut deux séances pour tracer une courbe. Continue à noter.</div>`;
 h+=`</div>`;

 h+=levelBlock(id);

 /* Historique séance par séance */
 h+=`<div class="eyebrow" style="margin:22px 0 12px">Historique · ${hist.length} séance${hist.length>1?"s":""}</div>`;
 if(!hist.length)h+=`<div class="card"><div style="font-size:13.5px;color:var(--mute)">Aucune séance enregistrée avec ce mouvement.</div></div>`;
 hist.forEach(r=>{
  const bestSet=r.sets.reduce((a,x)=>{const v=e1rm(x.weight,x.reps,x.diff);
   return v&&(!a.v||v>a.v)?{x,v}:a},{x:null,v:null}).x;
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${r.sets.length?"12px":"0"}">
   <b style="font-size:14.5px">${fLong(r.date)}</b>
   ${r.pr?'<span class="badge hot">Record</span>':r.rm!=null?`<span class="badge">${r.rm.toFixed(1)} kg est.</span>`:""}</div>`;
  if(r.sets.length){
   h+=`<div style="border-top:1px solid var(--line)">`+r.sets.map((x,i)=>{
    const v=e1rm(x.weight,x.reps,x.diff),top=bestSet&&x===bestSet;
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">
     <span style="flex:0 0 20px;font-size:11px;color:var(--mute);font-weight:600">${i+1}</span>
     <span style="flex:1;font-size:14px;${top?"font-weight:700":""}">${setLabel(x,m)}</span>
     ${x.diff?`<span style="font-size:11px;color:var(--mute)">${(DIFFS.find(d=>d.k===x.diff)||{}).l||""}</span>`:""}
     ${v?`<span style="font-size:12.5px;color:${top?"var(--aqua)":"var(--mute)"};font-weight:600;min-width:56px;text-align:right">${v.toFixed(1)} kg</span>`:""}
    </div>`}).join("")+`</div>`}
  r.mcs.forEach(x=>{h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;${r.sets.length?"":"border-top:1px solid var(--line)"}">
   <span style="flex:1;font-size:13.5px;color:var(--mute)">En metcon · ${esc(x.name)}</span>
   <span style="font-size:13px;font-weight:600">${x.txt}</span></div>`});
  h+=`</div>`});
 return h+`<div style="height:26px"></div></div>`}

/* ══════════ NIVEAU ══════════ */
function levelBlock(id){
  const m=mv(id);
  if(!RATIO[id]&&!REPSTD[id])return"";
  if(!S.profile)return`<div style="border-top:1px solid var(--line);margin:18px 0;padding-top:16px">
   <div class="eyebrow" style="margin-bottom:8px">Ton niveau</div>
   <div style="font-size:13px;color:var(--mute);line-height:1.6;margin-bottom:12px">Complète ton profil pour situer ce mouvement par rapport à des repères.</div>
   <button class="btn btn-quiet" style="padding:13px;font-size:13.5px" data-act="prof">Compléter mon profil</button></div>`;
  const st=stdFor(id,S.profile);if(!st)return"";
  const v=levelValue(id);
  const names=LVN[S.profile.sex==="m"?"m":"f"];
  if(v==null||!v){
   const rx=RX[id];
   return`<div style="border-top:1px solid var(--line);margin:18px 0;padding-top:16px">
    <div class="eyebrow" style="margin-bottom:8px">Ton niveau</div>
    <div style="font-size:13px;color:var(--mute);line-height:1.6">${st.unit==="kg"
     ?"Il faut une série chargée à 8 répétitions effectives ou moins pour se situer."
     :`Il faut une série au palier « ${m.lad&&rx!=null?m.lad[rx]:"standard"} » pour se situer.`}
    <br>Premier repère : <b style="color:var(--ink)">${st.t[0]}${st.unit==="kg"?" kg":" reps"}</b> pour ${names[0]}.</div></div>`}
  const L=levelInfo(v,st.t,names);
  const cols=["var(--seg0)","var(--aqua)","var(--aqua)","var(--aqua)","var(--melon)"];
  return`<div style="border-top:1px solid var(--line);margin:18px 0;padding-top:16px">
   <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px">
    <div class="eyebrow">Ton niveau</div>
    <button class="chip" style="padding:5px 11px;font-size:11.5px;box-shadow:none" data-act="prof">${S.profile.bw} kg · ${S.profile.age} ans</button></div>
   <div class="dsp" style="font-size:27px;margin-bottom:12px">${L.label}</div>
   <div class="lvbar">${L.segs.map((f,i)=>`<div class="lvseg" style="background:${f>=1?cols[i]:f<=0?"var(--track)":`linear-gradient(to right,${cols[i]} ${(f*100).toFixed(0)}%,var(--track) ${(f*100).toFixed(0)}%)`}"></div>`).join("")}</div>
   <div class="lvnames">${names.map((n,i)=>`<span style="${i===L.idx?"color:var(--ink);font-weight:600":""}">${LVSHORT[i]}</span>`).join("")}</div>
   <div style="font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:12px">
    ${L.next?`Encore <b style="color:var(--ink)">${(+L.next.need).toFixed(st.unit==="kg"?1:0)}${st.unit==="kg"?" kg":" reps"}</b> pour atteindre ${L.next.name}.`
      :G("Tu es arrivée","Tu es arrivé")+" au sommet de l'échelle sur ce mouvement."}
    <br><span style="opacity:.75">Repères indicatifs, ajustés à ton poids et à ton âge.</span></div></div>`}

/* Accord grammatical selon le profil ; neutre tant qu'il n'est pas renseigné */
const isM=()=>S.profile&&S.profile.sex==="m";
const G=(f,m)=>isM()?m:f;

function vDone(){
  const t=G("Séance enregistrée","Séance enregistrée");
  return`<div class="sheet" data-act="doneclbg"><div class="sheet-in" data-stop="1">
   <div style="padding:22px 22px calc(28px + env(safe-area-inset-bottom));overflow-y:auto">
   <div style="width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 20px"></div>

/* Charge de travail des 6 dernières semaines */
function weekLoad(){
  const wks=[],m=new Date();m.setDate(m.getDate()-((m.getDay()+6)%7));
  for(let i=5;i>=0;i--){const st=new Date(m);st.setDate(st.getDate()-i*7);
   const en=new Date(st);en.setDate(en.getDate()+6);
   const a=iso(st),b=iso(en);
   const ss=S.sessions.filter(x=>x.date>=a&&x.date<=b);
   let vol=0;
   ss.forEach(x=>{(x.entries||[]).forEach(e=>(e.sets||[]).forEach(y=>{vol+=y.dist?Math.round(y.dist/50):(y.reps||0)}));
    (x.metcons||[]).forEach(mc=>mcTotals(mc).forEach(t=>vol+=t.reps+Math.round(t.dist/50)+t.cal))});
   wks.push({n:ss.length,vol,label:fSh(a).slice(0,5)})}
  if(!wks.some(w=>w.n))return"";
  const mx=Math.max(1,...wks.map(w=>w.vol));
  const cur=wks[5],prev=wks[4];
  return`<div class="pane"><div class="card"><div class="eyebrow" style="margin-bottom:14px">Ces dernières semaines</div>
   <div style="display:flex;align-items:flex-end;gap:8px;height:74px">`+
   wks.map((w,i)=>`<div style="flex:1;text-align:center">
    <div style="height:${Math.max(3,w.vol/mx*56)}px;border-radius:6px 6px 3px 3px;
     background:${i===5?"var(--aqua)":"var(--track)"}"></div>
    <div style="font-size:9.5px;color:var(--mute);margin-top:6px;font-weight:600">${w.n||"–"}</div></div>`).join("")+
   `</div><div style="font-size:11px;color:var(--mute);text-align:center;margin-top:2px">séances par semaine</div>
   <div style="font-size:13px;color:var(--mute);line-height:1.6;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)">
   Cette semaine : <b style="color:var(--ink)">${cur.vol.toLocaleString("fr-FR")}</b> mouvements réalisés${prev.vol?` — la précédente, ${prev.vol.toLocaleString("fr-FR")}`:""}.</div></div></div>`}

/* Un point par seance : meilleure charge estimee, meilleure serie, meilleure allure */
function curveFor(id){
 return S.sessions.map(s=>{let rm=null,rp=0,pc=null;
   (s.entries||[]).filter(e=>e.movementId===id).forEach(e=>(e.sets||[]).forEach(x=>{
    const v=e1rm(x.weight,x.reps,x.diff);if(v&&(!rm||v>rm))rm=v;
    if(x.reps>rp)rp=x.reps;
    const p=paceOf(x,id);if(p&&(!pc||p<pc))pc=p}));
   return(rm||rp||pc)?{date:s.date,label:fSh(s.date),rm:rm?+rm.toFixed(1):null,
    reps:rp,pace:pc?+pc.toFixed(0):null}:null})
  .filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date))}

/* Historique detaille : chaque seance, ses series, et les passages en metcon */
function histFor(id){
 const out=[];
 sorted().forEach(s=>{
  const sets=[];
  (s.entries||[]).filter(e=>e.movementId===id).forEach(e=>(e.sets||[]).forEach(x=>sets.push(x)));
  const mcs=[];
  (s.metcons||[]).forEach(mc=>mcTotals(mc).forEach(t=>{if(t.id===id)
    mcs.push({name:mc.name||(FMT[mc.format]||FORMATS[0]).l,txt:t.txt,score:mcScore(mc)})}));
  if(sets.length||mcs.length)out.push({date:s.date,feel:s.feel,sets,mcs,
    rm:sets.reduce((a,x)=>{const v=e1rm(x.weight,x.reps,x.diff);return v&&(!a||v>a)?v:a},null)})});
 let top=null;
 [...out].reverse().forEach(r=>{if(r.rm!=null&&(top===null||r.rm>top+0.05)){r.pr=true;top=r.rm}});
 return out}

function chart(pts,key,unit,isTime){
  const W=300,H=168,P={t:14,r:10,b:24,l:40};
  const vs=pts.map(p=>p[key]);let mn=Math.min(...vs),mx=Math.max(...vs);
  if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.16;mn-=pad;mx+=pad;
  const X=i=>P.l+(W-P.l-P.r)*(i/(pts.length-1));
  /* Pour l'allure, plus c'est bas mieux c'est : on inverse l'axe */
  const Y=v=>P.t+(H-P.t-P.b)*(isTime?((v-mn)/(mx-mn)):(1-(v-mn)/(mx-mn)));
  const fmt=v=>isTime?mmss(v):Math.round(v);
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible" role="img" aria-label="Évolution">`;
  [0,.5,1].forEach(f=>{const y=P.t+(H-P.t-P.b)*f;
   g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" style="stroke:var(--line)" stroke-width="1.2"/>
       <text x="${P.l-8}" y="${y+4}" style="fill:var(--mute)" font-size="9.5" font-weight="500" text-anchor="end" font-family="Raleway">${fmt(isTime?mn+(mx-mn)*f:mx-(mx-mn)*f)}</text>`});
  const pl=pts.map((p,i)=>X(i)+","+Y(p[key])).join(" ");
  g+=`<polygon points="${P.l},${H-P.b} ${pl} ${W-P.r},${H-P.b}" style="fill:var(--aqua)" opacity=".14"/>
      <polyline fill="none" style="stroke:var(--aqua)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" points="${pl}"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(p[key])}" r="4" style="fill:var(--card);stroke:var(--aqua)" stroke-width="2.6"/>`});
  const L=pts[pts.length-1];
  g+=`<text x="${X(pts.length-1)}" y="${Y(L[key])-13}" style="fill:var(--ink)" font-size="12" font-weight="600" text-anchor="end" font-family="Raleway">${fmt(L[key])}${unit}</text>`;
  const sk=Math.ceil(pts.length/5);
  pts.forEach((p,i)=>{if(i%sk===0||i===pts.length-1)
   g+=`<text x="${X(i)}" y="${H-6}" style="fill:var(--mute)" font-size="9.5" font-weight="500" text-anchor="middle" font-family="Raleway">${p.label}</text>`});
  return g+`</svg>`}

function blankMetcon(){return{id:uid(),name:"",format:"amrap",cap:12,rounds:1,scheme:"",items:[],rx:false,
 res:{mode:"rounds",secs:0,rounds:0,reps:0,done:true}}}

/* "21-15-9" ou "21 15 9" ou "10-9-8..." -> [21,15,9] */
function parseScheme(str){
 if(!str)return null;
 const n=String(str).split(/[^0-9]+/).filter(Boolean).map(Number).filter(x=>x>0);
 return n.length>1?n:null}

/* Les formats à tours répétés ; l'AMRAP et l'EMOM tirent leur structure du temps */
const HASROUNDS=["fortime","intervals","chipper"];

function mcStructure(mc){
 const sch=parseScheme(mc.scheme);
 if(sch)return{sch,n:sch.length,label:sch.join("-")};
 const n=Math.max(1,mc.rounds||1);
 return{sch:null,n,label:n>1?n+" tours":"1 tour"}}

/* Volume total réellement effectué, tours et schéma compris */
function mcTotals(mc){
 const st=mcStructure(mc),out=[];
 mc.items.forEach(it=>{const m=mv(it.movementId),car=m.k==="cardio";
  const follows=st.sch&&it.lad!==false&&!car;
  const reps=car?0:(follows?st.sch.reduce((a,b)=>a+b,0):(it.reps||0)*st.n);
  const dist=(it.dist||0)*st.n,cal=(it.cal||0)*st.n;
  if(!reps&&!dist&&!cal)return;
  out.push({id:m.id,n:m.n,reps,dist,cal,ton:reps*(it.weight||0),
   txt:cal?cal+" cal":dist?dist+" m":reps+" "+(m.u==="sec"?"s":m.u==="m"?"m":"reps")})});
 return out}

/* ══════════ VOLUME AGRÉGÉ (travail spécifique + metcon) ══════════ */
function volumeSince(days){
 const lim=new Date();lim.setDate(lim.getDate()-days);const from=iso(lim);
 const by={};
 const add=(id,f,v,src)=>{if(!v)return;const o=by[id]=by[id]||{reps:0,dist:0,cal:0,ton:0,mcReps:0,mcDist:0};
  o[f]+=v;if(src==="mc"){if(f==="reps")o.mcReps+=v;if(f==="dist")o.mcDist+=v}};
 S.sessions.filter(s=>s.date>=from).forEach(s=>{
  (s.entries||[]).forEach(e=>(e.sets||[]).forEach(x=>{
   if(x.dist!=null){add(e.movementId,"dist",x.dist,"e")}
   else{add(e.movementId,"reps",x.reps||0,"e");add(e.movementId,"ton",(x.reps||0)*(x.weight||0),"e")}}));
  (s.metcons||[]).forEach(mc=>mcTotals(mc).forEach(t=>{
   add(t.id,"reps",t.reps,"mc");add(t.id,"dist",t.dist,"mc");
   add(t.id,"cal",t.cal,"mc");add(t.id,"ton",t.ton,"mc")}));
 });
 return by}

 ["Port de charge",["farmer","sled"]]
];
function patternShare(days){
 const by=volumeSince(days),tot={};
 PATTERNS.forEach(([n,ids])=>{tot[n]=0;
  ids.forEach(id=>{const o=by[id];if(o)tot[n]+=o.reps+Math.round(o.dist/50)+o.cal})});
 const max=Math.max(1,...Object.values(tot));
 return PATTERNS.map(([n])=>({n,v:tot[n],pct:tot[n]/max}))}

function itemLabel(it,st){const m=mv(it.movementId);
 if(it.cal)return`${it.cal} cal ${esc(m.n)}`;
 if(it.dist)return`${it.dist} m ${esc(m.n)}`;
 const r=st&&st.sch&&it.lad!==false?st.label:(it.reps||"?");
 return`${r} ${esc(m.n)}${it.weight?" @ "+it.weight+" kg":""}`}

function resLabel(mc){const r=mc.res||{};
 if(r.mode==="time")return r.secs?mmss(r.secs):"pas de temps";
 if(r.mode==="rounds")return`${r.rounds||0} tour${(r.rounds||0)>1?"s":""}${r.reps?" + "+r.reps+" reps":""}`;
 if(r.mode==="reps")return`${r.reps||0} reps`;
 return r.done?"terminé":"non terminé"}

function mcSummary(mc){const f=FMT[mc.format]||FORMATS[0],st=mcStructure(mc);
 const parts=[f.l+(mc.cap?" "+mc.cap+"'":"")];
 if(HASROUNDS.includes(mc.format)&&(st.sch||st.n>1))parts.push(st.label);
 if(mc.items.length)parts.push(mc.items.map(i=>mv(i.movementId).n).join(", "));
 parts.push(resLabel(mc));
 return parts.join(" · ")}

/* Score comparable dans le temps : plus haut = mieux, sauf pour le temps */
function mcScore(mc){const r=mc.res||{};
 if(r.mode==="time")return r.secs?{v:r.secs,lower:true,txt:mmss(r.secs)}:null;
 if(r.mode==="rounds")return(r.rounds||r.reps)?{v:(r.rounds||0)+(r.reps||0)/1000,lower:false,txt:resLabel(mc)}:null;
 if(r.mode==="reps")return r.reps?{v:r.reps,lower:false,txt:r.reps+" reps"}:null;
 return null}

/* Rappel des fois précédentes sur le même metcon nommé */
function hist_bench(name,curId){
  const n=(name||"").trim().toLowerCase();if(!n)return"";
  const past=[];
  S.sessions.forEach(s=>(s.metcons||[]).forEach(mc=>{
   if(mc.id!==curId&&(mc.name||"").trim().toLowerCase()===n){const sc=mcScore(mc);if(sc)past.push({date:s.date,sc,rx:mc.rx})}}));
  if(!past.length)return"";
  past.sort((a,b)=>b.date.localeCompare(a.date));
  return`<div class="card flat"><div class="eyebrow" style="margin-bottom:6px">Tes passages précédents</div>`+
   past.slice(0,4).map(x=>`<div class="row"><span style="font-size:13.5px;color:var(--mute)">${fMid(x.date)}</span>
   <span><span class="dsp" style="font-size:18px">${x.sc.txt}</span>${x.rx?' <span class="badge">Rx</span>':""}</span></div>`).join("")+`</div>`}

function setLabel(s,m){
  if(s.dist!=null)return`${s.dist} ${m.u==="m"&&m.k!=="cardio"?"m":"m"} — ${mmss(s.secs||0)}`;
  const u=m.u==="sec"?" s":m.u==="m"?" m":"";
  return(s.weight>0?s.weight+" kg × ":"")+s.reps+u}

   if(p)h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px">

    [5,10,15,20].map(b=>`<button class="chip ${S.bar===b?"on":""}" data-act="bar" data-v="${b}">Barre ${b}</button>`).join("")+`</div>`}

   else h+=`<button class="chip" style="margin-bottom:16px" data-act="lest">+ J'avais du lest</button>`;

/* Toutes les séries d'un mouvement, éditables directement.
   La 1RM retenue est la meilleure estimation parmi toutes les séries. */
function setsCard(en,m,isCar){
  if(!en.sets.length)return"";
  let h=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
   <div class="eyebrow">Séries de ce mouvement</div>
   <div class="eyebrow" style="letter-spacing:.06em">${isCar?"":"1RM est."}</div></div>`;
  if(isCar){
   h+=en.sets.map((s,i)=>`<div class="srow">
    <span class="pill">${i+1}</span>
    <span class="dsp" style="font-size:19px;flex:1">${setLabel(s,m)}</span>
    <button data-act="pop" data-i="${i}" aria-label="Supprimer la série" style="color:var(--mute);font-size:20px;padding:0 4px">×</button></div>`).join("");
   return h+`</div>`}

  const vals=en.sets.map(s=>e1rm(s.weight,s.reps,s.diff));
  const best=vals.reduce((a,b)=>b!=null&&(a==null||b>a)?b:a,null);
  const uL=m.u==="sec"?"s":m.u==="m"?"m":"reps";
  h+=en.sets.map((s,i)=>`<div class="srow">
   <span class="pill">${i+1}</span>
   <div style="flex:1.05;min-width:0"><input class="sin" type="number" inputmode="numeric" id="sr-${i}"
     data-set="${i}" data-f="reps" value="${s.reps||""}" aria-label="Répétitions série ${i+1}"></div>
   <span class="sunit">${uL}</span>
   <div style="flex:1.15;min-width:0"><input class="sin" type="number" inputmode="decimal" id="sw-${i}"
     data-set="${i}" data-f="weight" value="${s.weight||""}" placeholder="PdC" aria-label="Charge série ${i+1}"></div>
   <span class="sunit">kg</span>
   <button class="sdiff" data-act="scycle" data-i="${i}">${(DIFFS.find(d=>d.k===s.diff)||DIFFS[1]).l}</button>
   <span class="se1 ${vals[i]!=null&&vals[i]===best?"best":""}">${vals[i]!=null?vals[i].toFixed(0):"—"}</span>
   <button data-act="pop" data-i="${i}" aria-label="Supprimer la série" style="color:var(--mute);font-size:19px;padding:0 2px">×</button></div>`).join("");
  h+=`<button class="btn btn-quiet" style="margin-top:14px;padding:13px;font-size:13.5px" data-act="sadd">+ Ajouter une série</button>`;
  if(best!=null)h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;
    padding-top:14px;border-top:1px solid var(--line)">
    <span style="font-size:13.5px;color:var(--mute)">1RM estimée retenue</span>
    <span class="dsp" style="font-size:26px">${best.toFixed(1)} kg</span></div>`;
  else h+=`<div style="font-size:12px;color:var(--mute);line-height:1.55;margin-top:14px">
    Aucune série ne permet d'estimer une 1RM : il en faut une chargée, à 8 répétitions effectives ou moins.</div>`;
  return h+`</div>`}

function step(k,unit,st,min,sm){return`<div class="step${sm?" sm":""}">
 <button class="step-btn" aria-label="Diminuer" data-act="dec" data-k="${k}" data-s="${st}" data-min="${min||0}">−</button>
 <div class="step-val"><input type="number" inputmode="decimal" id="in-${k}" data-k="${k}" value="${S.d[k]}">
 <div class="eyebrow" style="margin-top:3px">${unit}</div></div>
 <button class="step-btn" aria-label="Augmenter" data-act="inc" data-k="${k}" data-s="${st}">+</button></div>`}

function barHTML(t,b){const lo=loadout(t,b);
 if(!lo)return`<div class="card flat" style="margin:0;padding:20px;text-align:center;color:var(--mute);font-size:13px">Charge inférieure à la barre (${b} kg)</div>`;
 const c={};lo.plates.forEach(p=>c[p.w]=(c[p.w]||0)+1);const W=300,cx=W/2;let x=20,g="";
 lo.plates.forEach(p=>{const w=p.w>=10?11:p.w>=5?8:6,hh=p.w>=20?36:p.w>=15?33:p.w>=10?28:p.w>=5?22:16;
  g+=`<rect x="${cx+x}" y="${28-hh/2}" width="${w}" height="${hh}" rx="2.5" fill="${p.c}"/>`
   +`<rect x="${cx-x-w}" y="${28-hh/2}" width="${w}" height="${hh}" rx="2.5" fill="${p.c}"/>`;x+=w+1.6});
 const leg=Object.entries(c).sort((a,b)=>b[0]-a[0]).map(([w,n])=>
  `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${PLATES.find(p=>p.w==w).c};margin-right:5px"></i><b>${w}</b>×${n}</span>`).join("");
 return`<div class="card flat" style="margin:0;padding:14px 12px 12px">
  <svg viewBox="0 0 ${W} 56" style="width:100%;height:56px;display:block"><rect x="8" y="25" width="${W-16}" height="6" rx="3" style="fill:var(--barbar)"/>${g}</svg>
  <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:8px;font-weight:500">
  <span>Barre <b>${b}</b></span>${leg}${lo.left>.01?`<span style="color:var(--lava)">reste ${lo.left} kg</span>`:""}</div></div>`}

/* ══════════ VUE : HISTORIQUE ══════════ */
/* Rappel discret de sauvegarde : ni bloquant, ni répété */
function backupNudge(){
  if(S.sessions.length<5)return"";
  const ref=S.lastExport||[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date))[0].date;
  const days=Math.round((new Date(TODAY)-new Date(ref))/864e5);
  if(days<28)return"";
  return`<div class="pane"><div class="card flat" style="display:flex;align-items:center;gap:12px;padding:14px 16px">
   <span style="flex:1;font-size:12.5px;color:var(--mute);line-height:1.5">${S.lastExport
    ?"Dernière sauvegarde il y a "+Math.round(days/7)+" semaines."
    :"Tes données n'ont jamais été sauvegardées."}</span>
   <button class="chip" style="flex:none" data-act="export">Exporter</button></div></div>`}

function vHist(){const H=sorted();
 let h=`<div class="head"><h1>Historique</h1></div>`+backupNudge();
 if(!H.length)h+=`<div class="empty">Tes séances enregistrées s'empileront ici.</div><div class="pane">`;
 else{h+=`<div class="pane">`;
  H.forEach(s=>{h+=`<div class="card"><button style="width:100%" data-act="open" data-id="${s.id}">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
   <div style="min-width:0"><div class="dsp" style="font-size:20px">${fMid(s.date)}</div>
   <div style="font-size:12.5px;color:var(--mute);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${[...(s.entries||[]).map(e=>esc(mv(e.movementId).n)),...(s.metcons||[]).map(mc=>esc(mc.name||FMT[mc.format].l))].join(" · ")||"—"}</div></div>
   <span style="color:var(--mute);font-size:19px">${S.open===s.id?"−":"+"}</span></div></button>`;
   if(S.open===s.id){h+=`<div style="margin-top:15px;border-top:1px solid var(--line);padding-top:11px">`+
    (s.entries||[]).map(e=>{const m=mv(e.movementId);
     return`<div style="padding:9px 0"><div style="font-weight:600;font-size:14.5px">${esc(m.n)}
     ${e.sets&&e.sets[0]&&e.sets[0].level!=null&&m.lad?`<span class="badge" style="margin-left:8px">${m.lad[e.sets[0].level]}</span>`:""}</div>
     <div style="font-size:13px;color:var(--mute);margin-top:4px">${(e.sets||[]).map(x=>setLabel(x,m)).join("   ·   ")}</div></div>`}).join("");
    (s.metcons||[]).forEach(mc=>{h+=`<div style="padding:11px 0;margin-top:6px;border-top:1px solid var(--line)">
     <div style="font-weight:600;font-size:14.5px">${esc(mc.name||(FMT[mc.format]||FORMATS[0]).l)}
     <span class="badge" style="margin-left:8px">${(FMT[mc.format]||FORMATS[0]).l}${mc.cap?" "+mc.cap+"'":""}</span>
     ${mc.rx?'<span class="badge" style="margin-left:5px">Rx</span>':""}</div>
     ${HASROUNDS.includes(mc.format)&&(parseScheme(mc.scheme)||mc.rounds>1)?`<div style="font-size:12.5px;color:var(--ink);font-weight:600;margin-top:5px">${mcStructure(mc).label} de :</div>`:""}
     ${mc.items.length?`<div style="font-size:13px;color:var(--mute);margin-top:5px;line-height:1.5">${mc.items.map(it=>itemLabel(it,mcStructure(mc))).join(" · ")}</div>`:""}
     <div class="dsp" style="font-size:19px;margin-top:7px">${resLabel(mc)}</div></div>`});
    if(s.feel)h+=`<span class="badge" style="margin-top:9px;display:inline-block">Sensation : ${FEEL[s.feel]}</span>`;
    if(s.note)h+=`<div style="font-size:13px;color:var(--mute);margin-top:11px;line-height:1.6">${esc(s.note)}</div>`;
    h+=`<div style="display:flex;gap:10px;margin-top:15px">
    <button class="btn btn-quiet" style="padding:12px;font-size:13px" data-act="edit" data-id="${s.id}">Modifier</button>
    <button class="btn btn-quiet" style="padding:12px;font-size:13px;color:var(--lava)" data-act="del" data-id="${s.id}">Supprimer</button></div></div>`}
   h+=`</div>`})}
 return h+`<div style="height:24px"></div></div>`}

/* ══════════ VUE : SÉLECTEUR ══════════ */
function vPicker(){const q=S.q.toLowerCase().trim();
 const L=allMoves().filter(m=>m.k!=="wod"&&(m.n.toLowerCase().includes(q)||m.g.toLowerCase().includes(q)));
 const G=[...new Set(L.map(m=>m.g))];
 let h=`<div class="sheet" data-act="closepick"><div class="sheet-in" data-stop="1">
  <div style="padding:18px 22px 10px"><div style="width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px"></div>
  <input class="inp" id="q" placeholder="Chercher un mouvement…" value="${esc(S.q)}"></div>
  <div style="overflow-y:auto;padding:0 22px 30px">`;
 if(q&&!L.length)h+=`<button class="btn btn-go" style="margin-top:18px" data-act="create">Créer « ${esc(S.q)} »</button>
  <div class="empty">Ce mouvement n'existe pas encore dans la liste. Tu peux l'ajouter.</div>`;
 G.forEach(g=>{h+=`<div style="margin-top:18px"><div class="eyebrow" style="margin-bottom:4px">${g}</div>`+
  L.filter(m=>m.g===g).map(m=>`<button class="mv" data-act="add" data-v="${m.id}">
  <span style="font-weight:500">${esc(m.n)}${m.d?`<br><small>${m.d}</small>`:""}</span><span style="color:var(--mute)">›</span></button>`).join("")+`</div>`});
 if(!q)h+=`<button class="btn btn-quiet" style="margin-top:20px" data-act="createAsk">Créer un mouvement</button>`;
 return h+`</div></div></div>`}

/* ══════════ RENDU ══════════ */
function render(){
 /* On mémorise le texte exact en cours de frappe. Sans cela, la valeur
    recalculée est réinjectée à chaque caractère et un champ vidé se remplit
    aussitôt d'un zéro, empêchant de tout effacer avant de saisir. */
 const a=document.activeElement,id=a&&a.id,ps=a&&a.selectionStart;
 const raw=a&&a.tagName==="INPUT"&&a.type!=="date"?a.value:null;
 document.getElementById("app").innerHTML=
  S.tab==="progres"?(S.fiche?vFiche(S.fiche):vProgres()):S.tab==="noter"?vNoter():S.tab==="profil"?vProfil():vHist();
 /* La barre d'onglets et les feuilles vivent hors de #app : un `position:fixed`
    se rattache au premier ancêtre transformé, ce qui le décrocherait de l'écran. */
 document.getElementById("tabs").innerHTML=
  [["progres","Progrès"],["noter","Noter"],["historique","Suivi"],["profil","Profil"]]
   .map(([k,l])=>`<button class="tab ${S.tab===k?"on":""}" data-act="tab" data-v="${k}">
    <svg viewBox="0 0 16 16" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TABICON[k]}</svg>
    <span>${l}</span></button>`).join("");
 document.getElementById("overlay").innerHTML=(S.picker?vPicker():"")+(S.done?vDone():"");
 if(id){const n=document.getElementById(id);if(n){
   if(raw!=null&&n.value!==raw)n.value=raw;
   n.focus();try{n.setSelectionRange(ps,ps)}catch(e){}}}}

/* ══════════ ÉVÉNEMENTS ══════════ */
/* On conserve les champs qui n'appartiennent pas à la série en cours
   (âge, poids de corps) : ils vivent dans le même objet de saisie. */
function seed(mid){const m=mv(mid),p=lastFor(mid),s=p&&p.e.sets[0];
 S.d={...S.d,w:s&&s.weight!=null?s.weight:(m.k==="barbell"?S.bar:0),
  reps:s&&s.reps?s.reps:(m.u==="sec"?30:m.k==="barbell"?5:10),
  diff:s&&s.diff?s.diff:"juste",level:s&&s.level!=null?s.level:(lvlOf(mid)??0),
  dist:s&&s.dist?s.dist:500,min:s&&s.secs?Math.floor(s.secs/60):2,sec:s&&s.secs?s.secs%60:0}}

function addMove(id){const e={id:uid(),movementId:id,sets:[]};
 S.draft.entries.push(e);S.focus=e.id;S.picker=false;S.q="";seed(id)}

function createMove(name){const n=(name||"").trim();if(!n)return null;
 const id="c-"+uid();S.custom.push({id,n,k:"gym",g:"Mes mouvements",d:"",u:"reps",lad:null});return id}

document.addEventListener("click",ev=>{
 const b=ev.target.closest("[data-act]");if(!b)return;
 if((b.dataset.act==="closepick"||b.dataset.act==="doneclbg")&&ev.target.closest("[data-stop]"))return;
 const a=b.dataset.act,v=b.dataset.v,en=entryOf();
 /* Un rendu obsolète peut laisser un bouton dont le contexte n'existe plus
    (séance abandonnée, metcon supprimé) : on l'ignore au lieu de planter. */
 if(/^(date|feel|focus|rm|saveS|drop|pick|mcpick|mcadd|mcopen|mcdel)$/.test(a)&&!S.draft)return;
 const MC=S.draft&&S.mc!=null?(S.draft.metcons||[])[S.mc]:null;
 if(/^(mcname|mcfmt|mcres|mcdone|mcrx|mcitemdel|mcstruct|mclad)$/.test(a)&&!MC)return;
 if(/^(push|pop|sadd|scycle)$/.test(a)&&!en)return;
 if(a==="add"&&!S.draft)return;
 switch(a){
  case"tab":S.tab=v;S.focus=null;S.fiche=null;break;
  case"prog":S.prog=v;break;
  case"progg":S.progG=v;S.prog=null;S.mq="";break;
  case"msort":S.msort=v;break;
  case"fiche":S.fiche=v;break;
  case"hv":S.hv=v;S.day=null;break;
  case"moff":{S.moff=Math.min(0,(S.moff||0)+(+v));S.day=null;break}
  case"day":S.day=S.day===v?null:v;break;
  case"dayclose":S.day=null;break;
  case"openday":S.tab="historique";S.open=v;S.day=null;break;
  case"fclose":S.fiche=null;break;
  case"ficheclose":S.done=null;S.tab="progres";S.fiche=v;break;
  case"prof":openProfil();break;
  case"toggsign":S.cloud.signup=!S.cloud.signup;break;
  case"signinpw":case"signup":{
    const m=(S.email||"").trim(),pw=S.pw||"";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){alert("Vérifie l'adresse mail saisie.");return}
    if(pw.length<6){alert("Le mot de passe doit compter au moins 6 caractères.");return}
    S.cloud.busy=true;render();
    const fin=()=>{S.cloud.busy=false;S.pw="";render()};
    const err=e=>{S.cloud.busy=false;render();
      const t=(e&&e.message)||"";
      alert(/Invalid login/i.test(t)?"Adresse ou mot de passe incorrect."
        :/already registered/i.test(t)?"Un compte existe déjà avec cette adresse. Utilise « J'ai déjà un compte »."
        :/CONFIRMATION_REQUISE/.test(t)?"La confirmation par mail est encore active côté Supabase. Désactive-la dans Authentication → Sign In / Providers → Email."
        :/at least/i.test(t)?"Mot de passe trop court."
        :"Connexion impossible : "+t)};
    (a==="signup"?window.CLOUD.signUp(m,pw):window.CLOUD.signInPw(m,pw)).then(fin).catch(err);
    return}

  case"signout":{if(!confirm("Te déconnecter ? Tes données restent sur cet appareil."))return;
    window.CLOUD.signOut();return}
  case"resync":cloudSync();return;
  case"theme":S.theme=v;applyTheme();break;
  case"wipe":{
    if(!confirm("Effacer définitivement toutes tes séances, ton profil et tes mouvements personnalisés ?\n\nCette action est irréversible. Pense à exporter avant."))return;
    if(!confirm("Confirmation : tout sera perdu. Continuer ?"))return;
    (async()=>{
      try{if(S.cloud.user&&window.CLOUD.wipe)await window.CLOUD.wipe()}catch(e){}
      S.sessions=[];S.custom=[];S.profile=null;S.draft=null;S.focus=null;S.mc=null;
      S.done=null;S.lastExport=null;S.pname="";S.updatedAt=Date.now();
      try{localStorage.removeItem(KEY);OLDKEYS.forEach(k=>localStorage.removeItem(k))}catch(e){}
      openProfil();render();
    })();
    return}
  case"psex":S.psex=v;break;
  case"psave":{const a=Number(S.d.age),b=Number(S.d.bw);
    if(!Number.isFinite(a)||!Number.isFinite(b)||a<14||a>100||b<30||b>250){
      alert("Vérifie l'âge et le poids saisis.");return}
    const first=!S.profile;
    S.profile={sex:S.psex,age:Math.round(a),bw:b,name:(S.pname||"").trim()};
    S.tab=first?"progres":"profil";break}
  case"new":S.draft=blank();S.tab="noter";S.focus=null;S.mc=null;break;
  case"repeat":{const l=sorted()[0];if(!l)break;
    S.draft={...blank(),entries:l.entries.map(e=>({id:uid(),movementId:e.movementId,sets:e.sets.map(x=>({...x}))}))};
    S.tab="noter";S.mc=null;break}
  case"date":S.draft.date=v;break;
  case"feel":S.draft.feel=+v;break;
  case"pick":S.picker=true;S.pickFor="entry";S.q="";break;
  case"mcpick":S.picker=true;S.pickFor="metcon";S.q="";break;
  case"mcadd":{if(!S.draft.metcons)S.draft.metcons=[];
    S.draft.metcons.push(blankMetcon());S.mc=S.draft.metcons.length-1;break}
  case"mcopen":S.mc=+b.dataset.i;break;
  case"mcclose":S.mc=null;break;
  case"mcdel":{if(confirm("Retirer ce metcon ?"))S.draft.metcons.splice(+b.dataset.i,1);break}
  case"mcname":{const mc=MC;mc.name=v;break}
  case"mcfmt":{const mc=MC,f=FMT[v]||FORMATS[0];
    mc.format=v;mc.res.mode=f.res;if(!mc.cap)mc.cap=f.cap;
    if(!HASROUNDS.includes(v)){mc.scheme="";mc.rounds=1}break}
  case"mcres":{MC.res.mode=v;break}
  case"mcdone":{MC.res.done=v==="1";break}
  case"mcrx":{MC.rx=v==="1";break}
  case"mcitemdel":{MC.items.splice(+b.dataset.i,1);break}
  case"mcstruct":{const mc=MC;
    if(v==="scheme"){if(!parseScheme(mc.scheme))mc.scheme="21-15-9"}
    else{mc.scheme="";if(!mc.rounds)mc.rounds=1}break}
  case"mclad":{const it=MC.items[+b.dataset.i];if(it)it.lad=it.lad===false;break}
  case"closepick":S.picker=false;break;
  case"add":{
    /* Si le metcon visé n'existe plus, le mouvement rejoint le travail spécifique
       plutôt que de faire échouer l'ajout. */
    if(S.pickFor==="metcon"&&MC){
      MC.items.push({movementId:v,reps:null,weight:null,dist:null,cal:null});
      S.picker=false;S.q=""}
    else addMove(v);break}
  case"create":{const id=createMove(S.q);if(id)addMove(id);break}
  case"createAsk":{const id=createMove(prompt("Nom du mouvement ?"));if(id)addMove(id);break}
  case"focus":{S.focus=b.dataset.id;const e=S.draft.entries.find(x=>x.id===S.focus);if(e)seed(e.movementId);break}
  case"unfocus":S.focus=null;break;
  case"rm":S.draft.entries=S.draft.entries.filter(e=>e.id!==b.dataset.id);break;
  case"bar":S.bar=+v;if(S.d.w<+v)S.d.w=+v;break;
  case"lvl":S.d.level=+v;break;
  case"diff":S.d.diff=v;break;
  case"lest":S.d.w=2.5;break;
  case"wadd":S.d.w=Math.max(0,rnd(S.d.w+ +v));break;
  case"inc":S.d[b.dataset.k]=rnd(S.d[b.dataset.k]+ +b.dataset.s);break;
  case"dec":S.d[b.dataset.k]=Math.max(+b.dataset.min||0,rnd(S.d[b.dataset.k]- +b.dataset.s));break;
  case"push":{if(!en)break;const m=mv(en.movementId);
    if(m.k==="cardio"){const secs=S.d.min*60+S.d.sec;
      if(!S.d.dist||!secs){alert("Indique une distance et un temps.");return}
      en.sets.push({dist:S.d.dist,secs})}
    else{if(!S.d.reps){alert("Indique au moins une répétition.");return}
      en.sets.push({weight:S.d.w,reps:S.d.reps,diff:S.d.diff,level:m.lad?S.d.level:null})}
    if(navigator.vibrate)navigator.vibrate(14);break}
  case"pop":if(en)en.sets.splice(+b.dataset.i,1);break;
  case"sadd":{if(!en)break;const l=en.sets[en.sets.length-1]||{weight:0,reps:5,diff:"juste",level:null};
    en.sets.push({...l});break}
  case"scycle":{if(!en)break;const st=en.sets[+b.dataset.i];
    const j=DIFFS.findIndex(d=>d.k===st.diff);st.diff=DIFFS[(j+1)%DIFFS.length].k;break}
  case"saveS":{const d=S.draft;d.entries=d.entries.filter(e=>e.sets.length);
    d.metcons=(d.metcons||[]).filter(x=>x.items.length||mcScore(x));S.mc=null;
    const before=new Set(milestones(S.sessions).map(x=>x.date+"|"+x.t+"|"+x.v));
    S.sessions=[...S.sessions.filter(x=>x.id!==d.id),d];
    const fresh=milestones(S.sessions).filter(x=>x.date===d.date&&!before.has(x.date+"|"+x.t+"|"+x.v));
    S.draft=null;S.focus=null;S.tab="progres";
    if(fresh.length)S.done=fresh.slice(0,5);break}
  case"donecl":case"doneclbg":S.done=null;break;
  case"pat":S.pat=!S.pat;break;
  case"drop":if(confirm("Abandonner cette saisie ?")){S.draft=null;S.focus=null;S.mc=null}break;
  case"open":S.open=S.open===b.dataset.id?null:b.dataset.id;break;
  case"edit":{const s=S.sessions.find(x=>x.id===b.dataset.id);if(!s)break;
    S.draft={...s,entries:s.entries.map(e=>({...e,sets:e.sets.map(x=>({...x}))})),
      metcons:(s.metcons||[]).map(x=>({...x,items:x.items.map(i=>({...i})),res:{...x.res}}))};
    S.tab="noter";S.focus=null;S.mc=null;break}
  case"del":if(confirm("Supprimer définitivement cette séance ?"))S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);break;
  case"export":{S.lastExport=TODAY;const bl=new Blob([JSON.stringify(
    {v:1,exported:TODAY,profile:S.profile,sessions:S.sessions,custom:S.custom},null,2)],{type:"application/json"});
    const u=URL.createObjectURL(bl),l=document.createElement("a");
    l.href=u;l.download="progres-crossfit-"+TODAY+".json";l.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);return}
  case"import":{const f=document.createElement("input");f.type="file";f.accept="application/json,.json";
    f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);
        if(!Array.isArray(d.sessions))throw 0;
        if(!confirm("Remplacer les données actuelles par celles du fichier ?"))return;
        S.sessions=d.sessions.map(x=>({metcons:[],entries:[],...x}));
        S.custom=d.custom||[];if(d.profile)S.profile=d.profile;
        S.draft=null;S.focus=null;S.mc=null;save();render();
      }catch(e){alert("Fichier illisible. Choisis un export généré par l'application.")}};
      r.readAsText(file)};f.click();return}
 }
 save();render()});

document.addEventListener("input",ev=>{const t=ev.target;
 if(t.id==="q"){S.q=t.value;render();return}
 if(t.id==="pn"){S.pname=t.value;return}
 if(t.id==="mq"){S.mq=t.value;render();return}
 if(t.id==="mail"){S.email=t.value;return}
 if(t.id==="pw"){S.pw=t.value;return}
 const MC=S.draft&&S.mc!=null?(S.draft.metcons||[])[S.mc]:null;
 if(t.id==="mcname"){if(MC)MC.name=t.value;save();return}
 if(t.id==="mccap"){if(MC)MC.cap=t.value===""?0:Math.max(0,parseInt(t.value)||0);save();return}
 if(t.id==="mcrounds"){if(MC)MC.rounds=Math.max(1,parseInt(t.value)||1);save();render();return}
 if(t.id==="mcscheme"){if(MC)MC.scheme=t.value;save();render();return}
 if(t.dataset.mi!=null){const it=MC&&MC.items[+t.dataset.mi];if(!it)return;
  const n=t.value===""?null:Math.max(0,parseFloat(t.value)||0);
  it[t.dataset.f]=n;
  if(t.dataset.f==="dist"&&n)it.cal=null;
  if(t.dataset.f==="cal"&&n)it.dist=null;
  save();render();return}
 if(t.dataset.mr){if(!MC)return;const r=MC.res,n=t.value===""?0:Math.max(0,parseInt(t.value)||0);
  if(t.dataset.mr==="min")r.secs=n*60+(r.secs%60);
  else if(t.dataset.mr==="sec")r.secs=Math.floor(r.secs/60)*60+n;
  else r[t.dataset.mr]=n;
  save();return}
 if(t.dataset.set!=null){const en=entryOf();if(!en)return;
  const st=en.sets[+t.dataset.set];if(!st)return;
  const n=t.value===""?0:Math.max(0,parseFloat(t.value)||0);
  st[t.dataset.f]=t.dataset.f==="reps"?Math.round(n):n;save();render();return}
 if(t.id==="dt"&&t.value){if(S.draft)S.draft.date=t.value;save();render();return}
 if(t.id==="nt"){if(S.draft)S.draft.note=t.value;save();return}
 if(t.dataset.k){S.d[t.dataset.k]=t.value===""?0:Math.max(0,parseFloat(t.value)||0);
  const en=entryOf();if(en){const m=mv(en.movementId);
   if(m.k==="barbell"||m.k==="cardio"||m.u==="reps"){save();render()}}}});

/* Recharge les champs du formulaire depuis le profil enregistré.
   Appelée à l'ouverture, mais aussi quand le cloud livre un profil après coup :
   sans cela l'écran garderait les valeurs par défaut affichées avant la synchro,
   et « Enregistrer » écraserait le bon profil. */
function seedProfil(){const p=S.profile||{sex:"f",age:30,bw:60,name:""};
 S.psex=p.sex||"f";S.pname=p.name||"";
 S.d.age=Number.isFinite(p.age)?p.age:30;
 S.d.bw=Number.isFinite(p.bw)?p.bw:60}

function openProfil(){seedProfil();S.tab="profil"}

/* ══════════ SYNCHRONISATION ══════════
   Le stockage local reste la source de vérité immédiate : l'application
   fonctionne hors ligne, et pousse vers le cloud dès que possible. */
let syncTimer=null;
function pushSoon(){
 if(!S.cloud||!S.cloud.user||!window.CLOUD)return;
 S.cloud.status="pending";clearTimeout(syncTimer);
 syncTimer=setTimeout(async()=>{
  try{await window.CLOUD.push(payload());S.cloud.status="ok"}
  catch(e){S.cloud.status="err"}
  render()},1200)}

function applyRemote(d){
 S.sessions=(d.sessions||[]).map(x=>({metcons:[],entries:[],...x}));
 /* Les séances viennent du cloud, mais les réglages ne sont écrasés que si la
    version distante en possède un : une ligne poussée avant la création du profil
    ne doit pas effacer celui saisi sur l'appareil. */
 S.bar=d.bar??S.bar??15;
 const rp=d.profile&&Number.isFinite(d.profile.age)&&Number.isFinite(d.profile.bw)?d.profile:null;
 S.profile=rp||S.profile||null;
 S.lastExport=d.lastExport||S.lastExport||null;
 if(d.theme){S.theme=d.theme;applyTheme()}
 /* Mouvements personnalisés : on réunit les deux côtés plutôt que d'en choisir un. */
 const seen=new Set(),merged=[];
 [...(d.custom||[]),...(S.custom||[])].forEach(c=>{if(c&&!seen.has(c.id)){seen.add(c.id);merged.push(c)}});
 const grew=merged.length!==(d.custom||[]).length;
 S.custom=merged;
 S.updatedAt=d.updatedAt||Date.now();
 seedProfil();
 try{localStorage.setItem(KEY,JSON.stringify(payload(true)))}catch(e){}
 /* Ce que le cloud ne connaissait pas lui est renvoyé. */
 if((!rp&&S.profile)||grew)pushSoon();}

async function cloudSync(){
 if(!window.CLOUD||!S.cloud.user)return;
 S.cloud.busy=true;S.cloud.status="pending";render();
 try{
  const r=await window.CLOUD.pull();
  const localHas=S.sessions.length>0,remoteHas=r&&(r.sessions||[]).length>0;
  if(!r||!remoteHas){await window.CLOUD.push(payload())}
  else if(!localHas||(r.updatedAt||0)>=(S.updatedAt||0)){applyRemote(r)}
  else{
   /* Les deux côtés ont des données et le local est plus récent : on demande. */
   const keepLocal=confirm(
    "Ton compte contient déjà "+(r.sessions||[]).length+" séance(s), et ce téléphone en a "+
    S.sessions.length+" plus récentes.\n\nOK = garder celles de ce téléphone et écraser le compte.\n"+
    "Annuler = récupérer celles du compte.");
   if(keepLocal)await window.CLOUD.push(payload());else applyRemote(r)}
  S.cloud.status="ok"}
 catch(e){S.cloud.status="err"}
 S.cloud.busy=false;render()}

window.addEventListener("cloud-auth",async()=>{
 S.cloud.enabled=!!(window.CLOUD&&window.CLOUD.enabled);
 S.cloud.user=window.CLOUD?window.CLOUD.user:null;
 if(S.cloud.user)await cloudSync();else{S.cloud.status="";render()}});
window.addEventListener("online",()=>{if(S.cloud.user)pushSoon()});
if(window.matchMedia)window.matchMedia("(prefers-color-scheme:dark)")
 .addEventListener("change",()=>{if(S.theme==="auto")applyTheme()});

load();
if(!S.profile)openProfil();
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
