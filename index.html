function vPicker(){
  /* Les mouvements récents sont proposés avant la recherche : dans un metcon,
     on réutilise presque toujours ceux du tour précédent. */const q=S.q.toLowerCase().trim();
 const nq=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""),qq=nq(q);
 const L=allMoves().filter(m=>m.k!=="wod"&&(nq(m.n).includes(qq)||nq(m.g).includes(qq)));
 const G=[...new Set(L.map(m=>m.g))];
 let h=`<div class="sheet" data-act="closepick"><div class="sheet-in" data-stop="1">
  <div style="padding:18px 22px 10px"><div style="width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px"></div>
  <input class="inp" id="q" placeholder="Chercher un mouvement…" value="${esc(S.q)}"></div>
  <div style="overflow-y:auto;padding:0 22px 30px">`;
 if(!q){const rec=recents(6);
  if(rec.length)h+=`<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Récemment utilisés</div>
   <div class="chips">`+rec.map(id=>`<button class="chip" style="border-color:var(--aqua);color:var(--aqua);font-weight:600"
    data-act="add" data-v="${id}">${esc(mv(id).n)}</button>`).join("")+`</div></div>`}
 if(q&&!L.length)h+=`<button class="btn btn-go" style="margin-top:18px" data-act="create">Créer « ${esc(S.q)} »</button>
  <div class="empty">Ce mouvement n'existe pas encore dans la liste. Tu peux l'ajouter.</div>`;
 G.forEach(g=>{h+=`<div style="margin-top:18px"><div class="eyebrow" style="margin-bottom:4px">${g}</div>`+
  L.filter(m=>m.g===g).map(m=>`<button class="mv" data-act="add" data-v="${m.id}">
  <span style="font-weight:500">${esc(m.n)}${m.d?`<br><small>${m.d}</small>`:""}</span><span style="color:var(--mute)">›</span></button>`).join("")+`</div>`});
 if(!q)h+=`<button class="btn btn-quiet" style="margin-top:20px" data-act="createAsk">Créer un mouvement</button>`;
 return h+`</div></div></div>`}


/* ══════════════════ EXPORT VISUEL ══════════════════
   Un calque dessiné dans un canvas, exporté en PNG. Trois fonds possibles :
   une photo de la bibliothèque, un aplat sombre, ou rien (calque transparent
   à poser soi-même dans Photos ou Instagram). */
/* Clés internes (aqua/gold/violet) conservées telles quelles (référencées dans le code
   plus bas) ; seules les teintes et les étiquettes changent pour suivre la palette
   « disques de compétition ». */
const SHCOL={aqua:"#6D9CEB",gold:"#E9BC3F",violet:"#5DBF7A",blanc:"#FFFFFF"};
const SHCOLN={aqua:"Bleu",gold:"Jaune",violet:"Vert",blanc:"Blanc"};
const SHFMT={"45":{w:1080,h:1350,l:"Publication 4:5"},"916":{w:1080,h:1920,l:"Story 9:16"}};

function shareData(){
 const k=S.share&&S.share.t;
 if(k==="record"){
  const id=S.share.id,m=mv(id),c=curveFor(id).filter(x=>x.rm!=null);
  const best=bestOf(id);
  const gain=c.length>1?best-c[0].rm:null;
  const quand=c.length?c[c.length-1].date:TODAY;
  return{tag:"RECORD",titre:m.n,val:best!=null?best.toFixed(best%1?1:0):"—",unit:"kg",
   sous:(gain&&gain>0?"+"+fx(gain)+" kg depuis "+fMid(c[0].date)+"  ·  ":"")+"charge max estimée",
   pied:fLong(quand)};}
 if(k==="metcon"){
  const s2=S.sessions.find(x=>x.id===S.share.id);if(!s2)return null;
  const mc=(s2.metcons||[])[S.share.i||0];if(!mc)return null;
  const f=FMT[mc.format]||FORMATS[0],sc=mcScore(mc),st=mcStructure(mc);
  return{tag:(f.l+(mc.cap?" · "+mc.cap+" MIN":"")).toUpperCase(),
   titre:mc.name||f.l,val:sc?sc.txt:"—",unit:"",
   rx:mc.rx,liste:mc.items.map(it=>itemLabel(it,st)).join("  ·  "),
   pied:fLong(s2.date)};}
 if(k==="seance"){
  const s2=S.sessions.find(x=>x.id===S.share.id);if(!s2)return null;
  /* Une série reste une série : on les garde séparées pour pouvoir
     les mettre en page proprement, sans tronquer. */
  const lab=(x,m)=>{
   if(x.dist!=null)return`${x.dist} m — ${mmss(x.secs||0)}`;
   const u=m.u==="sec"?" s":m.u==="m"?" m":" reps";
   return x.weight>0?`${x.weight} kg × ${x.reps}`:`${x.reps}${u}`};
  const mov=(s2.entries||[]).filter(e=>(e.sets||[]).length).map(e=>{const m=mv(e.movementId);
   return{n:m.n,sets:(e.sets||[]).map(x=>lab(x,m))}});
  const mcs=(s2.metcons||[]).map(mc=>{
   const f=FMT[mc.format]||FORMATS[0],sc=mcScore(mc),st=mcStructure(mc);
   const meta=[f.l+(mc.cap?" "+mc.cap+"'":"")];
   if(st.label&&st.label!=="1 tour")meta.push(st.label.toUpperCase());
   meta.push(mc.rx?"RX":"ADAPTÉ");
   return{n:mc.name||f.l,meta:meta.join("   ·   ").toUpperCase(),
    items:mc.items.map(it=>itemLabel(it,st)),res:sc?sc.txt:resLabel(mc)}});
  let reps=0,ton=0;
  (s2.entries||[]).forEach(e=>(e.sets||[]).forEach(x=>{
   reps+=x.dist?Math.round(x.dist/50):(x.reps||0);ton+=(x.reps||0)*(x.weight||0)}));
  (s2.metcons||[]).forEach(mc=>mcTotals(mc).forEach(t=>{reps+=t.reps+t.cal+Math.round(t.dist/50);ton+=t.ton}));

/* Découpe un texte en lignes tenant dans une largeur donnée */
function wrapTxt(g,txt,maxW){
 const mots=String(txt).split("  ·  ");const out=[];let cur="";
 mots.forEach(m=>{const essai=cur?cur+"  ·  "+m:m;
  if(g.measureText(essai).width<=maxW||!cur)cur=essai;else{out.push(cur);cur=m}});
 if(cur)out.push(cur);return out}

function rrect(g,x,y,w,h,r){g.beginPath();
 g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
 g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function shLogo(g,x,y,s,col,acc){
 const k=v=>v*s/512;
 const P=[[420,256],[338,398],[174,398],[92,256],[174,114],[338,114]];
 g.strokeStyle=col;g.lineJoin="round";g.lineCap="round";
 g.lineWidth=k(27);g.beginPath();
 P.forEach(([a,b],i)=>i?g.lineTo(x+k(a),y+k(b)):g.moveTo(x+k(a),y+k(b)));
 g.closePath();g.stroke();
 g.lineWidth=k(16);
 g.beginPath();g.moveTo(x+k(52),y+k(256));g.lineTo(x+k(205),y+k(256));g.stroke();
 g.beginPath();g.moveTo(x+k(307),y+k(256));g.lineTo(x+k(460),y+k(256));g.stroke();
 g.fillStyle=col;
 [[86,193,27,126],[40,213,23,86],[399,193,27,126],[449,213,23,86]].forEach(([a,b,w,h])=>{
  rrect(g,x+k(a),y+k(b),k(w),k(h),k(12));g.fill()});
 g.strokeStyle=acc;g.lineWidth=k(26);g.beginPath();
 [[150,322],[200,274],[240,304],[292,224],[322,250],[352,192]].forEach(([a,b],i)=>
  i?g.lineTo(x+k(a),y+k(b)):g.moveTo(x+k(a),y+k(b)));

/* Dessin du calque. Tout est proportionnel à la largeur pour que les deux
   formats partagent la même mise en page. */
/* Mise en page du modèle Séance, calculée avant tout dessin.
   Deux temps : on construit toutes les lignes, on mesure, puis on ajuste
   la taille pour que tout tienne — plutôt que de tronquer. */
function layoutSeance(g,D,W,H,M,BAS,MO,RA){
 const maxW=W-2*M;
 const BASE={mvn:{f:34,h:46,w:600,fam:"RA"},
             set:{f:27,h:37,w:700,fam:"MO"},
             mch:{f:37,h:54,w:700,fam:"RA"},
             mcm:{f:22,h:34,w:600,fam:"MO"},
             mci:{f:26,h:39,w:500,fam:"RA"},
             gap:{f:0, h:18},
             gpm:{f:0, h:40}};
 const police=(k,sc)=>(BASE[k].fam==="MO"?MO:RA)(BASE[k].w,Math.round(BASE[k].f*sc));
 function bloc(sc){
  const L=[];
  D.mov.forEach((m,i)=>{
   if(i)L.push({k:"gap"});
   L.push({k:"mvn",t:m.n});
   g.font=police("set",sc);
   wrapTxt(g,m.sets.join("  ·  "),maxW).forEach(t=>L.push({k:"set",t}));
  });
  D.mcs.forEach(mc=>{
   L.push({k:"gpm"});
   L.push({k:"mch",t:mc.n,r:mc.res});
   L.push({k:"mcm",t:mc.meta});
   g.font=police("mci",sc);
   mc.items.forEach(it=>wrapTxt(g,it,maxW-26).forEach(t=>L.push({k:"mci",t})));
  });
  return{L,hh:L.reduce((a,x)=>a+BASE[x.k].h*sc,0)}}
 const TITRE=110, PIED=104, SEP=44, HAUT=70;
 const budget=BAS-PIED-SEP-TITRE*0.92-46-30-HAUT;
 let sc=1;
 for(let i=0;i<3;i++){
  const{hh}=bloc(sc);
  if(hh>budget)sc=Math.max(0.62,sc*budget/hh);
  else if(i===0)break}
 const{L,hh}=bloc(sc);
 const top=Math.max(0,BAS-PIED-SEP-hh-TITRE*0.92-46-30-60);
 return{L,hh,sc,top,BASE,police,TITRE}}

/* Déplacement au doigt. Le rendu reconstruit le DOM à chaque changement,
   donc on écoute sur le document — les écouteurs survivent au redessin —
   et on réordonne dès que le doigt franchit le milieu d'une ligne voisine. */
function rowRect(i){const e=document.querySelector(`[data-row="${i}"]`);
 return e&&e.getBoundingClientRect?e.getBoundingClientRect():null}

document.addEventListener("pointerdown",ev=>{
 const g=ev.target.closest&&ev.target.closest("[data-drag]");
 if(!g||!S.draft||S.mc==null)return;
 const mc=(S.draft.metcons||[])[S.mc];if(!mc||mc.items.length<2)return;
 S.drag={i:+g.dataset.drag};
 ev.preventDefault();render();},{passive:false});

document.addEventListener("pointermove",ev=>{
 if(!S.drag)return;
 const mc=(S.draft.metcons||[])[S.mc];if(!mc)return;
 const i=S.drag.i,y=ev.clientY;
 for(const j of [i-1,i+1]){
  if(j<0||j>=mc.items.length)continue;
  const r=rowRect(j);if(!r)continue;
  const mid=r.top+r.height/2;
  if((j<i&&y<mid)||(j>i&&y>mid)){
   const [x]=mc.items.splice(i,1);mc.items.splice(j,0,x);
   S.drag.i=j;save();render();break}}
 ev.preventDefault();},{passive:false});

const dragEnd=()=>{if(S.drag){S.drag=null;save();render()}};
document.addEventListener("pointerup",dragEnd);
document.addEventListener("pointercancel",dragEnd);

/* ══════════ MOTEUR DE NIVEAU ══════════
   Ces calculs parcourent tout l'historique : on les mémorise et on ne les
   recalcule qu'au changement de données, de profil ou de test déclaré. */
let nivCache=null,nivKey=null;

/* Meilleure série d'un mouvement, à un palier d'échelle donné.
   Monroe note « strict / 2× kipping » : une répétition en kipping vaut
   une demi-répétition stricte. */
function bestSetAt(id,sl){
 let b=0;
 eachSet(id,x=>{
  if(x.weight)return;
  const r=x.reps||0;if(!r)return;
  const v=(sl!=null&&x.level!=null&&x.level<sl)?r/2:r;
  if(v>b)b=v});
 return b||null}

/* Répétitions réalisées à une charge au moins égale au poids de corps */
function bestRepsAtBW(id,bw){
 let b=0;eachSet(id,x=>{if(x.weight&&x.weight>=bw&&(x.reps||0)>b)b=x.reps});
 return b||null}

/* Valeur brute d'un critère de Monroe, ou null si la donnée manque */
function monroeValue(m,bw){
 if(m.k==="pct"){const v=bestOf(m.id);return v&&bw?v/bw*100:null}
 if(m.k==="best")return bestSetAt(m.id,m.sl);
 if(m.k==="bwrep")return bw?bestRepsAtBW(m.id,bw):null;
 if(m.k==="test")return bestHist((S.tests||{})[m.id]);
 return null}

/* 0 sous le premier seuil, puis 1, 2, 3. Escalier strict, aucune zone morte. */
function monroeScore(v,t){
 if(v==null)return null;
 return v>=t[2]?3:v>=t[1]?2:v>=t[0]?1:0}

/* Une étape de chaîne est acquise si s séries d'au moins r répétitions
   ont été réalisées dans une même séance (convention calisthénique). */
/* Une étape se valide de deux façons, et on retient la meilleure :
   — depuis l'historique : s séries d'au moins r répétitions dans une même séance
   — par déclaration : le nombre de répétitions par série que l'on sait tenir,
     utile quand le mouvement se travaille ailleurs que dans les séances notées. */
function stepState(st,ck,i){
 const dk=ck+":"+i;
 const declare=bestHist((S.decl||{})[dk]);
 if(st.hold){
  const v=declare;
  return{ok:v!=null&&v>=st.r,vu:v,need:st.r,hold:true,declare};}
 let bestSets=0,bestRep=0;
 if(!st.mv)return{ok:declare!=null&&declare>=st.r,best:0,bestRep:0,
  repEff:declare||0,need:st.s,declare,hold:false};
 S.sessions.forEach(se=>{
  let n=0;
  (se.entries||[]).filter(e=>e.movementId===st.mv).forEach(e=>(e.sets||[]).forEach(x=>{
   if(x.weight)return;
   const lvOk=st.lv==null||(x.level??0)>=st.lv;
   if(!lvOk)return;
   const r=x.reps||0;
   if(r>bestRep)bestRep=r;
   if(r>=st.r)n++}));
  if(n>bestSets)bestSets=n});
 /* La déclaration s'exprime en répétitions par série, sur le nombre de séries exigé. */
 const repEff=Math.max(bestRep,declare||0);
 const ok=bestSets>=st.s||(declare!=null&&declare>=st.r);
 return{ok,best:bestSets,bestRep,repEff,need:st.s,declare,hold:false}}

/* Épinglage libre : « c|chainId|index » pour une étape de chaîne,
   « t|id » pour un test Monroe. Sert à garder sous les yeux ce qu'on
   travaille en ce moment, sans dérouler chaque chaîne à chaque fois. */
const isPinned=k=>(S.pin||[]).includes(k);
const starSvg=on=>`<svg viewBox="0 0 24 24" width="15" height="15" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg>`;
function pinBtn(key,label){return`<button data-act="pin" data-v="${key}" aria-label="${isPinned(key)?"Désépingler":"Épingler"} ${esc(label)}"
 style="flex:none;padding:2px;color:${isPinned(key)?"var(--melon)":"var(--mute)"}">${starSvg(isPinned(key))}</button>`}

/* ── Historique daté des tests et déclarations ──
   S.tests[id] et S.decl[clé] sont des tableaux [{d:"AAAA-MM-JJ"|null, v:nombre}],
   triés du plus ancien au plus récent. d:null marque une valeur reprise telle
   quelle d'avant cette mise à jour, sans date d'origine connue. */
function bestHist(arr){if(!arr||!arr.length)return null;let b=null;
 arr.forEach(e=>{if(e.v>0&&(b==null||e.v>b))b=e.v});return b}
const fmtN=v=>(Math.round(v*10)/10).toString().replace(".",",");
/* Reprend un dictionnaire d'avant cette version (valeurs scalaires) sans rien
   perdre : chaque nombre devient une entrée unique, sans date connue. */
function migrateHistDict(obj){
 const src=(obj&&typeof obj==="object")?obj:{},out={};
 for(const k in src){const v=src[k];
  if(Array.isArray(v))out[k]=v;else if(Number.isFinite(v))out[k]=[{d:null,v}]}
 return out}
/* Fusionne deux dictionnaires d'historique (local et distant) sans dupliquer :
   une entrée est la même des deux côtés si sa date et sa valeur coïncident. */
function mergeHist(a,b){
 const out={},keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
 keys.forEach(k=>{const seen=new Set(),arr=[];
  [...(a&&a[k]||[]),...(b&&b[k]||[])].forEach(e=>{const sig=e.d+"|"+e.v;
   if(!seen.has(sig)){seen.add(sig);arr.push(e)}});
  arr.sort((x,y)=>(x.d||"").localeCompare(y.d||""));out[k]=arr});
 return out}
function sparkSvg(arr){
 const W=260,H=46,P=4,vals=arr.map(e=>e.v),top=Math.max(...vals),low=Math.min(...vals,0),
  x=i=>P+(i*(W-2*P))/(arr.length-1),y=v=>H-P-((v-low)/((top-low)||1))*(H-2*P),last=arr.length-1;
 return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:46px;display:block" aria-label="Évolution des tests">
  <polyline points="${arr.map((e,i)=>`${x(i).toFixed(1)},${y(e.v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--aqua)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <circle cx="${x(last).toFixed(1)}" cy="${y(arr[last].v).toFixed(1)}" r="3" fill="var(--aqua)"/></svg>`}
/* Bloc pliable : sparkline + liste datée + suppression du dernier test.
   kind vaut "tests" ou "decl" — désigne le dictionnaire concerné. */
function histBlock(kind,key,unit){
 const arr=(S[kind]||{})[key]||[],open=S.histOpen===kind+"|"+key,hkey=kind+"|"+key;
 let h=`<button data-act="histt" data-v="${hkey}"
  style="background:none;border:0;padding:0;margin-top:7px;font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px">${
   open?"Masquer l'historique":"Historique"+(arr.length?` (${arr.length})`:"")}</button>`;
 if(open){
  h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">`;
  if(arr.length>1)h+=sparkSvg(arr);
  if(arr.length){
   h+=`<ol style="list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:120px;overflow:auto">`+
    arr.slice().reverse().map(e=>`<li style="display:flex;justify-content:space-between;font-size:12px;color:var(--mute)">
     <span>${e.d?fSh(e.d):"reprise de l'ancienne version"}</span><span>${fmtN(e.v)} ${esc(unit)}</span></li>`).join("")+`</ol>
    <button data-act="unlog" data-v="${key}" data-k="${kind}"
     style="align-self:flex-start;background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px;color:var(--mute);margin-top:8px">Supprimer le dernier test</button>`
  }else h+=`<span style="font-size:12px;color:var(--mute)">Aucun test pour l'instant.</span>`;
  h+=`</div>`}
 return h}

/* Une ligne de test Monroe (mouvement chronométré ou déclaratif), réutilisée
   dans « Tests à renseigner » et dans « Focus ». */
function testRow(m,pinnable){
 const key="t|"+m.id,arr=(S.tests||{})[m.id]||[],best=bestHist(arr);
 return`<div style="padding:9px 0;border-top:1px solid var(--line)">
  <div style="display:flex;align-items:center;gap:10px">
  ${pinnable?pinBtn(key,m.n):""}
  <span style="flex:1;min-width:0"><span style="font-size:13.5px;display:block">${esc(m.n)}${
    best!=null?` · <b style="color:var(--aqua)">${fmtN(best)} ${esc(m.u)}</b>`:""}</span>
  ${m.d?`<span style="font-size:12px;color:var(--mute);display:block;line-height:1.45;margin-top:2px">${esc(m.d)}</span>`:""}
  <span style="font-size:12px;color:var(--mute);display:block;margin-top:2px">repère ${m.t[0]} / ${m.t[1]} / ${m.t[2]} ${esc(m.u)}</span></span>
  </div>
  <div style="display:flex;gap:6px;margin-top:8px">
  <input class="sin" style="flex:1;min-width:0" type="number" inputmode="numeric"
   id="in-${m.id}" placeholder="Nouveau test (${esc(m.u)})">
  <button class="chip" style="padding:8px 14px;flex:none" data-act="log" data-v="${m.id}" data-k="tests">Noter</button></div>
  ${histBlock("tests",m.id,m.u)}</div>`}

function niveau(){
 const bw=S.profile&&Number.isFinite(S.profile.bw)?S.profile.bw:null;
 const key=[S.updatedAt||0,bw,S.profile&&S.profile.sex,JSON.stringify(S.tests||{}),JSON.stringify(S.decl||{})].join("|");
 if(nivCache&&nivKey===key)return nivCache;

 /* ── Les mouvements Monroe ── */
 const mv36=MONROE.map(m=>{const v=monroeValue(m,bw);
  return{...m,v,sc:monroeScore(v,m.t)}});

 /* ── Paliers ── */
 const paliers=PALIERS.map(P=>{
  const L=mv36.filter(x=>x.p===P.n);
  const somme=L.reduce((a,x)=>a+(x.sc||0),0);
  const testes=L.filter(x=>x.sc!=null).length;
  return{...P,pct:Math.round(somme/(L.length*3)*100),testes,total:L.length,
   acquis:somme/(L.length*3)>=0.7}});
 let courant=paliers.find(x=>!x.acquis)||paliers[paliers.length-1];

 /* ── Catégories et compartiments ── */
 const cats=Object.keys(CATS).map(c=>{
  const zones=CATZ[c].map(z=>{
   const L=mv36.filter(x=>x.c===c&&x.e===z&&x.sc!=null);
   return{z,pct:L.length?Math.round(L.reduce((a,x)=>a+x.sc,0)/(L.length*3)*100):null,n:L.length}})
   .filter(x=>x.pct!=null);
  return{c,l:CATS[c],zones}}).filter(x=>x.zones.length);

 /* ── Chaînes ── */
 const chains=CHAINS.map(ch=>{
  let bloque=false;
  const steps=ch.steps.map((st,i)=>{
   const r=stepState(st,ch.id,i);
   const etat=r.ok?"acquis":bloque?"verrou":"encours";
   if(!r.ok)bloque=true;
   return{...st,...r,etat}});
  const faits=steps.filter(x=>x.etat==="acquis").length;
  const encours=steps.find(x=>x.etat==="encours");
  return{...ch,steps,faits,total:steps.length,encours}});

 const r={mv36,paliers,courant,cats,chains,bw};
 nivKey=key;nivCache=r;return r}


/* ══════════ ÉCRAN NIVEAU ══════════
   Catalogue unifié : chaque mouvement Monroe et chaque étape de chaîne
   devient une carte de même forme (statut, valeur/cible, critère,
   prérequis), regroupées par compartiment (le vocabulaire commun à
   MONROE.e et CHAINS.z) et filtrables par statut. Rien dans les données
   n'est modifié : on ne fait que recomposer l'affichage de niveau(). */

/* Couleur d'un compartiment ; retombe sur un gris neutre si absent */
const catCol=z=>ZCOL[z]||"var(--seg0)";

/* Statut à 4 états, commun aux deux systèmes.
   — Monroe : jamais verrouillé (philosophie « hors ordre » de l'appli) :
     pas encore testé = à débloquer côté affichage seulement (« débloqué »),
     une valeur sous le meilleur seuil = en cours, seuil du haut = Rx.
   — Chaîne : verrou/en cours/acquis viennent déjà de niveau(). */
const monroeStatus=sc=>sc===3?"rx":sc==null?"ready":"progress";
const chainStepStatus=etat=>etat==="acquis"?"rx":etat==="encours"?"progress":"locked";
const STATUS_V={
 locked:{label:"À débloquer",bg:"transparent",bd:"var(--line)",col:"var(--mute)"},
 ready:{label:"Débloqué",bg:"var(--sunk)",bd:"var(--line)",col:"var(--ink)"},
 progress:{label:"En cours",bg:"var(--aqua)",bd:"var(--aqua)",col:"var(--onacc)"},
 rx:{label:"Rx",bg:"var(--melon)",bd:"var(--melon)",col:"var(--onacc)"}};

/* Corps de carte pour un mouvement Monroe : valeur/cible, barre, critère,
   saisie de test et historique — repris de l'ancien testRow(). */
function monRowBody(m){
 const goal=m.t[2],val=m.v;
 const pct=val!=null?Math.min(100,Math.round(val/goal*100)):0;
 const crit=(m.d?esc(m.d)+" · ":"")+`repère ${m.t[0]} / ${m.t[1]} / ${m.t[2]} ${esc(m.u)}`;
 return`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 6px">
   <span class="dsp" style="font-size:24px">${val!=null?fmtN(val):"—"}<span style="font-size:15px;color:var(--mute);font-weight:600"> / ${fmtN(goal)} ${esc(m.u)}</span></span></div>
  <div style="height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-bottom:10px">
   <div style="width:${pct}%;height:100%;border-radius:4px;background:${m.sc===3?"var(--melon)":"var(--aqua)"}"></div></div>
  <div style="font-size:12px;color:var(--mute);line-height:1.5;margin-bottom:10px">${crit}</div>
  <div style="display:flex;gap:7px;margin-bottom:4px">
   <input class="sin" style="flex:1;min-width:0" type="number" inputmode="numeric"
    id="in-${m.id}" placeholder="Nouveau test (${esc(m.u)})">
   <button class="chip" style="padding:10px 16px;flex:none" data-act="log" data-v="${m.id}" data-k="tests">Noter</button></div>
  ${histBlock("tests",m.id,m.u)}`}

/* Corps de carte pour une étape de chaîne : valeur/cible, barre, où-j'en-suis,
   prérequis (l'étape précédente), déclaration manuelle et charge max
   éventuelle — repris de l'ancien stepInner(). */
function chainRowBody(ch,st,i){
 const unite=st.u||"reps";
 const cible=st.hold?`${st.r} ${unite}`:st.s>1?`${st.s} × ${st.r}`:`${st.r} ${unite}`;
 const fait=st.hold?st.vu:st.repEff;
 const pct=fait?Math.min(100,Math.round(fait/st.r*100)):0;
 const src=st.declare!=null&&st.declare>=(st.bestRep||0)?"déclaré":"depuis tes séances";
 const sub=st.etat==="verrou"?`ordre conseillé — après ${esc(ch.steps[i-1].n)}`
  :(fait?`${st.hold?fait+" "+unite:st.s+" × "+fait} sur ${cible} · ${src}`:"pas encore renseigné");
 let h=`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 4px">
   <span class="dsp" style="font-size:24px">${fait?fmtN(fait):"—"}<span style="font-size:15px;color:var(--mute);font-weight:600"> / ${esc(cible)}</span></span></div>`;
 if(fait)h+=`<div style="height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-bottom:8px">
   <div style="width:${pct}%;height:100%;border-radius:4px;background:${st.etat==="acquis"?"var(--melon)":"var(--aqua)"}"></div></div>`;
 h+=`<div style="font-size:12px;color:var(--mute);line-height:1.5;margin-bottom:10px">${esc(sub)}</div>`;
 if(i>0){const prev=ch.steps[i-1],ok=prev.etat==="acquis";
  h+=`<div style="display:flex;align-items:center;gap:7px;font-size:12px;color:${ok?"var(--aqua)":"var(--mute)"};margin-bottom:10px">
   <span>${ok?"●":"○"}</span><span>${esc(prev.n)}</span></div>`}
 {const dclKey=ch.id+":"+i;
  h+=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
   <span style="font-size:12px;color:var(--mute);flex:none">${st.hold?"Je tiens":"Je fais "+st.s+" ×"}</span>
   <input class="sin" style="width:64px;flex:none;padding:10px 4px;font-size:16px" type="number" inputmode="numeric"
    id="in-${dclKey}" placeholder="—">
   <span style="font-size:12px;color:var(--mute);flex:none">${esc(unite)}</span>
   <button class="chip sm" style="margin-left:auto" data-act="log" data-v="${dclKey}" data-k="decl">Noter</button></div>
   ${histBlock("decl",dclKey,unite)}`}
 if(st.ld){
  const rmKey="rm:"+st.ld,rm=bestOf(st.ld),dr=bestHist((S.decl||{})[rmKey]);
  const val=Math.max(rm||0,dr||0);
  h+=`<div style="display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
   <span style="font-size:12px;color:var(--mute);flex:1">Charge max${val?` · ${val.toFixed(val%1?1:0)} kg${rm&&val===rm?" estimée":""}`:""}</span>
   <input class="sin" style="width:64px;flex:none;padding:10px 4px;font-size:16px" type="number" inputmode="decimal"
    id="in-${rmKey}" placeholder="—">
   <button class="chip sm" data-act="log" data-v="${rmKey}" data-k="decl">Noter</button></div>
   ${histBlock("decl",rmKey,"kg")}`}
 if(st.src&&st.etat!=="verrou")h+=`<div style="font-size:12px;color:var(--mute);margin-top:6px;opacity:.8">${esc(st.src)}</div>`;
 return h}

/* Coquille commune à toute carte : bandeau catégorie, épingle, nom,
   étiquette palier/chaîne · compartiment, et statut (tampon Rx ou pastille). */
function cardShell(o){
 const isRx=o.status==="rx",locked=o.status==="locked",v=STATUS_V[o.status];
 return`<div style="background:${locked?"transparent":"var(--card)"};
   border:${locked?"1px dashed var(--line)":isRx?"1px solid var(--melon)":"1px solid var(--line)"};
   border-radius:20px;padding:16px 18px;margin-bottom:12px;opacity:${locked?.62:1}">
  <div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:10px">
   ${pinBtn(o.key,o.name)}
   <span style="flex:0 0 5px;height:36px;border-radius:3px;background:${catCol(o.zone)};margin-top:1px"></span>
   <span style="flex:1;min-width:0">
    <span class="dsp" style="display:block;font-weight:700;font-size:18px;text-transform:uppercase;line-height:1.05;
     color:${locked?"var(--mute)":"var(--ink)"}">${esc(o.name)}</span>
    <span style="display:block;font-size:12px;color:var(--mute);margin-top:2px">${o.tier===o.zone?esc(o.tier):esc(o.tier)+" · "+esc(o.zone)}</span></span>
   ${isRx?`<span class="dsp" style="width:38px;height:38px;flex:none;border:2px solid var(--melon);border-radius:50%;
     color:var(--melon);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;transform:rotate(-8deg)">RX</span>`
    :`<span class="dsp" style="font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;background:${v.bg};
     color:${v.col};border:1px solid ${v.bd};white-space:nowrap;flex:none;margin-top:3px">${v.label}</span>`}
  </div>
  ${o.body}</div>`}

/* Aplatit MONROE (jamais verrouillé) et les étapes de CHAINS (verrou/en
   cours/acquis déjà calculés) en une seule liste de cartes normalisées. */
function catalogue(N){
 const rows=[];
 N.mv36.forEach(m=>rows.push({key:"t|"+m.id,zone:m.e,tier:"Palier "+m.p,name:m.n,
  status:monroeStatus(m.sc),body:monRowBody(m)}));
 N.chains.forEach(ch=>ch.steps.forEach((st,i)=>rows.push({key:"c|"+ch.id+"|"+i,zone:ch.z,tier:ch.n,name:st.n,
  status:chainStepStatus(st.etat),body:chainRowBody(ch,st,i)})));
 return rows}

const NFILTS=[["tout","Tout"],["progress","En cours"],["ready","Débloqués"],["locked","À débloquer"],["rx","Rx"]];

/* Puces de filtre par statut, avec leur nombre — sur la liste complète,
   pas sur ce qui est déjà filtré, pour que les autres puces restent cliquables. */
function filterChipsHTML(rows){
 const c={tout:rows.length,progress:0,ready:0,locked:0,rx:0};
 rows.forEach(r=>c[r.status]++);
 return`<div class="chips" style="margin:14px 0 4px">`+NFILTS.map(([k,l])=>
   `<button class="chip ${((S.nfilt||"tout")===k)?"on":""}" data-act="nfilt" data-v="${k}">${l} <span style="opacity:.7">${c[k]}</span></button>`)
  .join("")+`</div>`}

/* Le catalogue filtré, groupé par compartiment (ordre de CATZ), chaque
   section n'apparaissant que si elle contient au moins une carte visible. */
function catalogHTML(N){
 const rows=catalogue(N),filt=S.nfilt||"tout";
 let h=filterChipsHTML(rows);
 const shown=filt==="tout"?rows:rows.filter(r=>r.status===filt);
 if(!shown.length)return h+`<div class="card" style="margin-top:12px"><div style="font-size:13.5px;color:var(--mute)">
  Aucun mouvement dans ce filtre pour l'instant.</div></div>`;
 const zones=[].concat(...Object.values(CATZ));
 zones.forEach(z=>{
  const inZ=shown.filter(r=>r.zone===z);
  if(!inZ.length)return;
  h+=`<div class="eyebrow" style="margin:20px 0 10px;display:flex;align-items:center;gap:8px">
   <span style="width:9px;height:9px;border-radius:2px;background:${catCol(z)}"></span>${esc(z)}</div>`;
  inZ.forEach(r=>h+=cardShell(r))});
 return h}

/* En-tête « Par catégorie » : reprend tel quel le pourcentage par
   compartiment déjà calculé dans niveau(), sans nouveau calcul. */
function catBarsHTML(N){
 const zones=N.cats.flatMap(x=>x.zones);
 if(!zones.length)return"";
 return`<div class="card"><div class="eyebrow" style="margin-bottom:14px">Par catégorie</div>
  <div style="display:flex;flex-direction:column;gap:11px">`+

   <div style="flex:1;height:7px;border-radius:4px;background:var(--track);overflow:hidden">
    <div style="width:${z.pct}%;height:100%;border-radius:4px;background:${catCol(z.z)}"></div></div>
   <span style="width:34px;flex:none;text-align:right;font-size:12px;color:var(--mute)">${z.pct} %</span></div>`).join("")+
  `</div></div>`}

 N.paliers.forEach(x=>{

 return h+`<div style="height:26px"></div></div>`}

/* Contenu d'une étape de chaîne — nom, cible, statut, saisie manuelle,
   charge max éventuelle. Isolé pour être réutilisé dans le détail d'une
   chaîne et dans la section Focus (voir plus bas). */
function stepInner(ch,st,i,pinnable){
 const col=st.etat==="acquis"?ch.col:st.etat==="encours"?"var(--aqua)":"var(--line)";
 const txt=st.etat==="verrou"?"var(--mute)":"var(--ink)";
 const unite=st.u||"reps";
 const cible=st.hold?`${st.r} ${unite}`:st.s>1?`${st.s} × ${st.r}`:`${st.r} ${unite}`;
 const fait=st.hold?st.vu:st.repEff;
 const key="c|"+ch.id+"|"+i;
 let h=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
   <span style="font-size:15px;font-weight:${st.etat==="encours"?600:500};color:${txt};display:flex;align-items:center;gap:6px">
    ${pinnable?pinBtn(key,st.n):""}<span>${esc(st.n)}</span></span>
   <span style="font-size:12px;font-weight:600;color:${st.etat==="verrou"?"var(--mute)":col};white-space:nowrap">${cible}</span></div>`;
 /* Où j'en suis, et de quelle source vient l'information */
 if(st.etat!=="verrou"){
  const src=st.declare!=null&&st.declare>=(st.bestRep||0)?"déclaré":"depuis tes séances";
  h+=`<div style="font-size:12px;color:var(--mute);margin-top:4px">${
    fait?`${st.hold?fait+" "+unite:st.s+" × "+fait} sur ${cible} · ${src}`:"pas encore renseigné"}</div>`;
  if(fait&&!st.ok)h+=`<div style="height:6px;border-radius:3px;background:var(--track);margin-top:6px;overflow:hidden">
    <div style="width:${Math.min(100,Math.round(fait/st.r*100))}%;height:100%;border-radius:3px;background:var(--aqua)"></div></div>`;
 }else h+=`<div style="font-size:12px;color:var(--mute);margin-top:4px">ordre conseillé — après ${esc(ch.steps[i-1].n)}</div>`;
 /* Déclaration manuelle, toujours accessible même sur une étape verrouillée */
 {const dclKey=ch.id+":"+i;
  h+=`<div style="display:flex;align-items:center;gap:7px;margin-top:8px">
   <span style="font-size:12px;color:var(--mute);flex:none">${st.hold?"Je tiens":"Je fais "+st.s+" ×"}</span>
   <input class="sin" style="width:64px;flex:none;padding:8px 4px;font-size:16px" type="number" inputmode="numeric"
    id="in-${dclKey}" placeholder="—">
   <span style="font-size:12px;color:var(--mute);flex:none">${unite}</span>
   <button class="chip sm" style="margin-left:auto" data-act="log" data-v="${dclKey}" data-k="decl">Noter</button></div>
   ${histBlock("decl",dclKey,unite)}`}
 if(st.ld){
  const rmKey="rm:"+st.ld,rm=bestOf(st.ld),dr=bestHist((S.decl||{})[rmKey]);
  const val=Math.max(rm||0,dr||0);
  h+=`<div style="display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
   <span style="font-size:12px;color:var(--mute);flex:1">Charge max${val?` · ${val.toFixed(val%1?1:0)} kg${rm&&val===rm?" estimée":""}`:""}</span>
   <input class="sin" style="width:64px;flex:none;padding:8px 4px;font-size:16px" type="number" inputmode="decimal"
    id="in-${rmKey}" placeholder="—">
   <button class="chip sm" data-act="log" data-v="${rmKey}" data-k="decl">Noter</button></div>
   ${histBlock("decl",rmKey,"kg")}`}
 if(st.src&&st.etat!=="verrou")h+=`<div style="font-size:12px;color:var(--mute);margin-top:5px;opacity:.8">${st.src}</div>`;
 return h}

/* Étapes de chaîne et tests Monroe épinglés à la main : une vue condensée
   de ce qu'on travaille en ce moment, sans dérouler chaque chaîne. */
function pinnedItemsHTML(N){
 const rows=[];
 (S.pin||[]).forEach(k=>{
  if(k.startsWith("t|")){
   const m=N.mv36.find(x=>x.id===k.slice(2));if(m)rows.push({t:"t",m})
  }else{
   const p=k.split("|"),ch=N.chains.find(c=>c.id===p[1]),i=+p[2];
   if(ch&&ch.steps[i])rows.push({t:"c",ch,i,st:ch.steps[i]})
  }});
 if(!rows.length)return"";
 let h=`<div class="eyebrow" style="margin:22px 0 12px">Focus</div><div class="card" style="padding:16px">`;
 rows.forEach((r,idx)=>{
  h+=`<div style="${idx?"margin-top:14px;padding-top:14px;border-top:1px solid var(--line)":""}">`;
  h+=r.t==="c"?`<div style="font-size:12px;color:var(--mute);margin-bottom:4px">${esc(r.ch.n)}</div>${stepInner(r.ch,r.st,r.i,true)}`:testRow(r.m,true);
  h+=`</div>`});
 return h+`</div>`}

/* Suggestions : la première étape non acquise de chaque chaîne, et les tests
   Monroe pas encore renseignés — ce qu'il y a de plus utile à attaquer maintenant. */
function nextUpHTML(N){
 const sugg=[];
 N.chains.forEach(ch=>{
  if(!ch.encours)return;
  const i=ch.steps.indexOf(ch.encours),key="c|"+ch.id+"|"+i;
  if(!isPinned(key))sugg.push({key,label:ch.encours.n,sub:ch.n})});
 N.mv36.filter(m=>m.k==="test"&&m.sc==null).forEach(m=>{
  const key="t|"+m.id;
  if(!isPinned(key))sugg.push({key,label:m.n,sub:"Test à renseigner"})});
 if(!sugg.length)return"";
 let h=`<div class="eyebrow" style="margin:22px 0 12px">À attaquer ensuite</div><div class="card" style="padding:6px 16px">`;
 sugg.slice(0,8).forEach((s,idx)=>{
  h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;${idx?"border-top:1px solid var(--line)":""}">
   <span style="flex:1;min-width:0"><span style="font-size:13.5px;display:block">${esc(s.label)}</span>
   <span style="font-size:12px;color:var(--mute)">${esc(s.sub)}</span></span>
   <button class="chip sm" data-act="pin" data-v="${s.key}">Épingler</button></div>`});
 return h+`</div>`}

/* ══════════ RENDU ══════════ */
let lastView=null,pendingAnchor=null;
let animView=null,lastOpen=null,vinT=null;
function render(){
 if(window.PLAN&&window.PLAN.hold())return;
 /* On mémorise le texte exact en cours de frappe. Sans cela, la valeur
    recalculée est réinjectée à chaque caractère et un champ vidé se remplit
    aussitôt d'un zéro, empêchant de tout effacer avant de saisir. */
 const a=document.activeElement,id=a&&a.id,ps=a&&a.selectionStart;
 const raw=a&&a.tagName==="INPUT"&&a.type!=="date"?a.value:null;
 /* Changer de catégorie ou de vue modifie la hauteur du contenu. Sans ancrage,
    la page garde sa position absolue et le bloc semble sauter sous le doigt.
    On mesure sa position à l'écran avant et après, puis on compense. */
 const anc=pendingAnchor;pendingAnchor=null;
 let ancTop=null,h0=null,sp0=0;
 const sp=document.getElementById("spacer");
 if(anc){try{const e=document.getElementById(anc);
   if(e&&e.getBoundingClientRect)ancTop=e.getBoundingClientRect().top;
   /* Hauteur totale avant redessin, cale comprise. Si la page raccourcit,
      le navigateur borne le défilement et remonte de force : aucune
      compensation ne peut alors aboutir. On maintient donc la hauteur. */
   if(sp){sp0=parseFloat(sp.style.height)||0;
    h0=document.documentElement.scrollHeight}}catch(e){}}
 if((S.tabsOff||[]).includes(S.tab))S.tab="progres";
 document.getElementById("app").innerHTML=
  S.tab==="plan"?(typeof vPlan==="function"?vPlan():""):S.tab==="progres"?(S.fiche&&!(S.ps==="mouvements"&&wide2())?vFiche(S.fiche):S.records?vRecords():S.ps?vPSub(S.ps):vProgres()):S.tab==="noter"?vNoter()
  :S.tab==="niveau"?vNiveau():S.tab==="profil"?vProfil():vHist();
 /* Transitions courtes (lot 7) : seulement quand on change d'écran ou de détail, jamais à chaque
    rendu ; fondu seul (pas de transform, qui décrocherait les éléments fixes). Coupées si

  case"saveS":{const d=S.draft;d.entries=d.entries.filter(e=>e.sets.length);

function seedProfil(){const p=S.profile||{sex:"f",age:30,bw:60,name:""};
 S.psex=p.sex||"f";S.pname=p.name||"";

/* ══════════ SYNCHRONISATION ══════════
   Le stockage local reste la source de vérité immédiate : l'application
   fonctionne hors ligne, et pousse vers le cloud dès que possible. */
let syncTimer=null,lastPull=0;
function pushSoon(){
 if(!S.cloud||!S.cloud.user||!window.CLOUD)return;
 S.cloud.status="pending";clearTimeout(syncTimer);
 syncTimer=setTimeout(async()=>{
  try{
   /* Verrou optimiste : on ne pousse que si personne n'a écrit sur le compte
      depuis notre dernière lecture. Si quelqu'un l'a fait entre-temps, on ne
      l'écrase pas en silence — on relance une synchro complète pour arbitrer. */
   const r=await window.CLOUD.push(payload(),S.cloud.serverUpdatedAt);
   if(r&&r.conflict){S.cloud.status="pending";render();await cloudSync();return}
   if(r&&r.serverUpdatedAt)S.cloud.serverUpdatedAt=r.serverUpdatedAt;
   S.cloud.status="ok"}
  catch(e){S.cloud.status="err"}
  render()},1200)}

/* Réunit deux listes de séances sans rien perdre : chaque id présent d'un
   côté ou de l'autre est conservé une seule fois. « primaire » l'emporte
   quand le même id existe des deux côtés (cas rare — une séance éditée
   avant que l'autre côté ait reçu le changement). Il n'y a donc plus jamais
   à choisir entre « ce téléphone » et « le compte » : les deux sont réunis. */
/* Séances : pour une même séance, la version modifiée le plus récemment l'emporte
   (à égalité, celle du compte, comme avant). Une séance supprimée après sa dernière
   modification ne revient pas, d'où qu'elle vienne. */
function normTomb(x){return Array.isArray(x)?x.filter(z=>z&&z.id).map(z=>({id:String(z.id),at:Number(z.at)||0})):[]}
function mergeTomb(a,b){const m={};[...normTomb(a),...normTomb(b)].forEach(z=>{if(!m[z.id]||z.at>m[z.id])m[z.id]=z.at});
 return Object.keys(m).map(id=>({id,at:m[id]}))}
function mergeSessions(primaire,secondaire,tombes){
 const byId={};
 (primaire||[]).forEach(s=>{if(s&&s.id)byId[s.id]=s});
 (secondaire||[]).forEach(s=>{if(!s||!s.id)return;const o=byId[s.id];if(!o||(s.updatedAt||0)>(o.updatedAt||0))byId[s.id]=s});
 const del={};normTomb(tombes).forEach(z=>{del[z.id]=z.at});
 return Object.values(byId).filter(s=>!(del[s.id]&&del[s.id]>=(s.updatedAt||0)))}

/* Programmes du module Plan : réunion des deux côtés, la version la plus
   récente de chaque programme l'emporte, et une suppression faite sur un
   appareil n'est pas annulée par l'autre. */
function normPlanif(x){return{programs:x&&Array.isArray(x.programs)?x.programs:[],deleted:x&&Array.isArray(x.deleted)?x.deleted:[]}}
/* Un même programme modifié sur deux appareils : la structure (blocs, séances, exercices)
   vient de la version la plus récente, mais le suivi est fusionné entrée par entrée
   (séances notées, modifications, déplacements, ordres, séances ajoutées) grâce à la
   date de chaque entrée (p.ts). Sans date des deux côtés, on garde l'ancien comportement. */
const PL_MAPS=["logs","overrides","moves","orders"];
function mergeProg(a,b){
 const ta=a.ts||{},tb=b.ts||{},newer=(a.updatedAt||0)>=(b.updatedAt||0)?a:b;
 const out={...newer},ts={...tb};
 Object.keys(ta).forEach(k=>{if(!(k in ts)||ta[k]>ts[k])ts[k]=ta[k]});
 const pick=(f,k,A,B,N)=>{const x=ta[f+"|"+k]||0,y=tb[f+"|"+k]||0;return x>y?A:y>x?B:N};
 PL_MAPS.forEach(f=>{const A=a[f]||{},B=b[f]||{},N=newer[f]||{},R={};
  new Set([...Object.keys(A),...Object.keys(B)]).forEach(k=>{const src=pick(f,k,A,B,N);if(Object.prototype.hasOwnProperty.call(src,k))R[k]=src[k]});
  out[f]=R});
 const ix=l=>{const m={};(l||[]).forEach(e=>{if(e&&e.id)m[e.id]=e});return m};
 const XA=ix(a.extras),XB=ix(b.extras),XN=ix(newer.extras),XR=[];
 new Set([...Object.keys(XA),...Object.keys(XB)]).forEach(id=>{const src=pick("extras",id,XA,XB,XN);if(src[id])XR.push(src[id])});
 if(a.extras||b.extras)out.extras=XR;
 out.ts=ts;out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);return out}
function mergePlanif(a,b){a=normPlanif(a);b=normPlanif(b);
 const del={};[...a.deleted,...b.deleted].forEach(z=>{if(z&&z.id&&(!del[z.id]||z.at>del[z.id]))del[z.id]=z.at});
 const by={};[...b.programs,...a.programs].forEach(p=>{if(!p||!p.id)return;const o=by[p.id];by[p.id]=o?mergeProg(p,o):p});
 const programs=Object.values(by).filter(p=>!(del[p.id]&&del[p.id]>=(p.updatedAt||0)))
  .sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));
 return{programs,deleted:Object.keys(del).map(id=>({id,at:del[id]}))}}
/* Efface tout sur cet appareil. Avec propager (compte connecté), l'effacement est daté :
   la synchro le propage au compte puis aux autres appareils (voir stripBefore). Une copie complète est gardée d'abord
   dans les sauvegardes de l'appareil, comme avant une mise à jour. */
function wipeAll(propager){
 try{const b=backups();b.unshift({ver:"avant effacement",at:new Date().toISOString(),data:backupData()});
  setBackups(b)}catch(e){}
 const now=Date.now(),pl=normPlanif(S.planif);
 S.sessions=[];S.custom=[];S.profile=null;S.draft=null;S.focus=null;S.mc=null;S.fiche=null;
 S.done=null;S.lastExport=null;S.pname="";S.tests={};S.decl={};S.pin=[];S.delSessions=[];
 S.planif={programs:[],deleted:pl.deleted.concat(pl.programs.filter(p=>p&&p.id).map(p=>({id:p.id,at:now})))};
 S.pain={zones:[],zt:now,log:{}};painVer++;
 if(propager!==false)S.wipedAt=now;
 try{OLDKEYS.concat(["planif-run"]).forEach(k=>localStorage.removeItem(k))}catch(e){}
 save()}
/* « Tout effacer » : l'appareil qui efface pose une date (wipedAt). Tout ce qui est antérieur
   est retiré des deux côtés, sinon l'autre appareil renverrait ses données à la synchro suivante.
   Les séances, programmes et notes de douleur postérieurs à l'effacement sont gardés ;
   les mouvements perso ne sont gardés que s'ils servent encore dans une séance gardée. */
function stripBefore(d,W){
 const sessions=(d.sessions||[]).filter(x=>x&&(x.updatedAt||0)>W),used=new Set();
 sessions.forEach(x=>{(x.entries||[]).forEach(e=>used.add(e.movementId));
  (x.metcons||[]).forEach(m=>(m.items||[]).forEach(i=>used.add(i.movementId)))});
 const pl=normPlanif(d.planif),pn=normPain(d.pain),log={};
 Object.keys(pn.log).forEach(k=>{if(pn.log[k].t>W)log[k]=pn.log[k]});
 return{...d,sessions,custom:(d.custom||[]).filter(c=>c&&used.has(c.id)),
  planif:{programs:pl.programs.filter(p=>p&&(p.updatedAt||0)>W),deleted:pl.deleted},
  pain:pn.zt>W?{zones:pn.zones,zt:pn.zt,log}:{zones:[],zt:0,log},
  tests:{},decl:{},pin:[],profile:null,lastExport:null,wipedAt:W}}
function applyRemote(rec){
 let d=rec&&rec.payload?rec.payload:(rec||{}),wipedNow=false;
 const rW=Number(d.wipedAt)||0,lW=Number(S.wipedAt)||0;
 if(rW>lW){/* effacé sur un autre appareil : on applique ici */
  const st=stripBefore(payload(true),rW);
  S.sessions=st.sessions;S.custom=st.custom;S.planif=st.planif;S.pain=st.pain;
  S.tests={};S.decl={};S.pin=[];S.profile=null;S.lastExport=null;S.wipedAt=rW;
  S.delSessions=[];S.focus=null;S.mc=null;S.fiche=null;painVer++;wipedNow=true}
 else if(lW>rW)d=stripBefore(d,lW);/* effacé ici : ce qui reste sur le compte est périmé */
 if(rec&&rec.serverUpdatedAt)S.cloud.serverUpdatedAt=rec.serverUpdatedAt;
 const remoteSessions=(d.sessions||[]).map(x=>({metcons:[],entries:[],...x}));
 /* Une séance qui n'existait que sur ce téléphone (pas encore poussée)
    doit survivre à la fusion : on la renvoie ensuite vers le compte. */
 const remTomb=normTomb(d.delSessions);
 S.delSessions=mergeTomb(S.delSessions,remTomb);
 S.sessions=mergeSessions(remoteSessions,S.sessions,S.delSessions);
 const remById={};remoteSessions.forEach(r=>{if(r&&r.id)remById[r.id]=r});
 const localSeules=S.sessions.some(s=>!remById[s.id]||(s.updatedAt||0)!==(remById[s.id].updatedAt||0))
  ||S.sessions.length!==remoteSessions.length||S.delSessions.length!==remTomb.length;
 /* Les autres réglages viennent du cloud, mais ne sont écrasés que si la
    version distante en possède un : une ligne poussée avant la création du profil
    ne doit pas effacer celui saisi sur l'appareil. */
 S.bar=d.bar??S.bar??15;
 const rp=d.profile&&Number.isFinite(d.profile.age)&&Number.isFinite(d.profile.bw)?d.profile:null;
 S.profile=rp||S.profile||null;
 S.lastExport=d.lastExport||S.lastExport||null;
 S.tests=mergeHist(S.tests,migrateHistDict(d.tests));
 S.decl=mergeHist(S.decl,migrateHistDict(d.decl));
 S.pin=[...new Set([...(S.pin||[]),...(d.pin||[])])];
 if(Array.isArray(d.tabsOff))S.tabsOff=d.tabsOff;
 const painAvant=JSON.stringify(normPain(d.pain));S.pain=mergePain(S.pain,d.pain);
 const painDiff=JSON.stringify(S.pain)!==painAvant;painVer++;
 if(d.theme){S.theme=d.theme;applyTheme()}
 /* Mouvements personnalisés : on réunit les deux côtés plutôt que d'en choisir un. */
 const seen=new Set(),merged=[];
 [...(d.custom||[]),...(S.custom||[])].forEach(c=>{if(c&&!seen.has(c.id)){seen.add(c.id);merged.push(c)}});
 const grew=merged.length!==(d.custom||[]).length;
 S.custom=merged;
 const remPl=normPlanif(d.planif);
 S.planif=mergePlanif(S.planif,remPl);
 const remJ={};remPl.programs.forEach(p=>{if(p&&p.id)remJ[p.id]=JSON.stringify(p)});
 const plDiff=S.planif.programs.length!==remPl.programs.length||S.planif.programs.some(p=>remJ[p.id]!==JSON.stringify(p))||S.planif.deleted.length!==remPl.deleted.length;
 /* Important : ne PAS estampiller avec Date.now() ici. On vient de recevoir
    l'état du serveur, donc le repère local doit désormais correspondre à
    l'horodatage serveur (et non à "maintenant"), sinon toute ouverture de
    l'app sans la moindre modification locale ferait paraître ce téléphone
    "plus récent" que le compte au prochain lancement. */
 S.updatedAt=(rec&&rec.serverUpdatedAt)?new Date(rec.serverUpdatedAt).getTime():Date.now();
 seedProfil();if(wipedNow&&!S.profile)openProfil();
 {const raw=JSON.stringify(payload(true));try{localStorage.setItem(KEY,raw);lsFail=false}catch(e){lsFail=true}idbWrite(raw,S.updatedAt)}
 /* Ce que le cloud ne connaissait pas lui est renvoyé. */
 if((!rp&&S.profile)||grew||localSeules||plDiff||painDiff)pushSoon();}

async function cloudSync(){
 try{await idbReady}catch(e){}
 if(!window.CLOUD||!S.cloud.user)return;
 lastPull=Date.now();
 S.cloud.busy=true;S.cloud.status="pending";render();
 try{
  const r=await window.CLOUD.pull();
  const remote=r&&r.payload?r.payload:null;
  /* Une ligne vidée par « Tout effacer » porte wipedAt : elle doit être fusionnée (pour propager
     l'effacement), pas écrasée par les données de cet appareil. */
  const remoteHas=remote&&((remote.sessions||[]).length>0||(remote.planif&&(remote.planif.programs||[]).length>0)||Number(remote.wipedAt)>0);
  if(!r||!remoteHas){
   const res=await window.CLOUD.push(payload());
   if(res&&res.serverUpdatedAt)S.cloud.serverUpdatedAt=res.serverUpdatedAt}
  else{
   if(r.serverUpdatedAt)S.cloud.serverUpdatedAt=r.serverUpdatedAt;
   /* Fusion sans perte, toujours silencieuse : chaque séance, déclaration,
      test ou épinglage connu d'un côté ou de l'autre est conservé, qu'il
      vienne de ce téléphone ou du compte. Il n'y a donc plus jamais besoin
      de demander lequel garder — l'ancienne question ("écraser le compte ?")
      pouvait resurgir à chaque lancement pour la moindre broutille (un
      onglet ouvert, un mouvement épinglé) et risquait, à force, de faire
      appuyer sur "écraser" par réflexe et perdre de vraies séances. */
   applyRemote(r)}
  S.cloud.status="ok"}
 catch(e){S.cloud.status="err"}
 S.cloud.busy=false;render()}

window.addEventListener("cloud-auth",async()=>{
 S.cloud.enabled=!!(window.CLOUD&&window.CLOUD.enabled);
 S.cloud.user=window.CLOUD?window.CLOUD.user:null;
 if(S.cloud.user)await cloudSync();else{S.cloud.status="";render()}});
/* Retour au premier plan, retour du réseau : on relit le compte (au plus une fois par minute).
   Sur iPhone, l'app installée reste ouverte en mémoire des heures ; sans cette relecture,
   une séance notée sur l'ordinateur n'apparaissait qu'après avoir fermé puis rouvert l'app.
   cloudSync() fusionne sans rien perdre, puis renvoie ce que le compte ne connaissait pas. */
function resync(force){
 if(!S.cloud||!S.cloud.user||S.cloud.busy)return;
 if(!force&&Date.now()-lastPull<60000)return;
 cloudSync()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")resync(false)});
window.addEventListener("online",()=>resync(true));
try{window.matchMedia&&window.matchMedia("(min-width:1000px)").addEventListener("change",()=>render())}catch(e){}
if(window.matchMedia)window.matchMedia("(prefers-color-scheme:dark)")
 .addEventListener("change",()=>{if(S.theme==="auto")applyTheme()});

load();
snapshotOnUpdate();
const idbReady=idbBoot();
try{const tq=new URLSearchParams(location.search).get("tab");if(["progres","noter","plan","historique","profil"].includes(tq))S.tab=tq}catch(e){}
/* Demande à l'appareil de ne jamais effacer de lui-même les données de l'app (accordé par iOS
   surtout pour une app ajoutée à l'écran d'accueil). Sans effet visible, sans risque si refusé. */
try{if(navigator.storage&&navigator.storage.persisted&&navigator.storage.persist)
 navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{})}catch(e){}
if(!S.profile)openProfil();
render();
/* Mise à jour du "service worker" : sur iPhone, une appli ajoutée à l'écran
   d'accueil ne revérifie une nouvelle version qu'à la relance, et ne
   l'affiche qu'une fois qu'elle a pris la main — sans rien de plus, il
   fallait donc fermer puis rouvrir l'appli deux fois de suite pour voir un
   changement. On revérifie nous-mêmes à chaque retour au premier plan, et
   on recharge la page tout seul dès qu'une version plus récente est prête. */
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js").then(reg=>{
  document.addEventListener("visibilitychange",()=>{
   if(document.visibilityState==="visible")reg.update().catch(()=>{})});
  window.addEventListener("focus",()=>{reg.update().catch(()=>{})});
 }).catch(()=>{});
 let refreshed=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{
  if(refreshed)return;refreshed=true;window.location.reload()});
}
</script>

<script type="module">
/* ═══════════ CONNEXION AU CLOUD (Supabase) ═══════════
   Remplace les deux valeurs ci-dessous par celles de ton projet.
   La clé "anon" est publique par conception : la sécurité repose sur
   les règles RLS définies côté base, qui isolent chaque utilisateur. */
const SUPABASE_URL = "https://wkuydmxwoeoytlfuvvhx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrdXlkbXh3b2VveXRsZnV2dmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MjI4MjQsImV4cCI6MjEwMTQ5ODgyNH0.tr8_L-Ln7nIo_Gn7eEQpZi1M66ZVTENCgQAR4R1AdMk";

const configured = !SUPABASE_URL.includes("REMPLACE") && SUPABASE_ANON_KEY.length > 40;
const CLOUD = { enabled: configured, user: null, client: null,
  async signIn(){}, async signInPw(){}, async signUp(){}, signOut(){}, async pull(){return null}, async push(){}, async wipe(){} };
window.CLOUD = CLOUD;

if (configured) {
  try {
    /* Copie locale (vendor/supabase.js) en priorité ; l'ancien chargement en ligne reste en secours. */
    const createClient = (window.supabase && window.supabase.createClient)
      || (await import("https://esm.sh/@supabase/supabase-js@2")).createClient;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    CLOUD.client = sb;

    CLOUD.signIn = (email) => sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: window.location.origin + window.location.pathname }
    }).then(({ error }) => { if (error) throw error; });

    /* Mot de passe : seule méthode qui fonctionne en application installée.
       iOS isole le stockage de la web app de celui de Safari, où atterrirait
       un lien de connexion ; et le service de mail par défaut de Supabase
       n'envoie qu'aux adresses de l'équipe du projet. Aucun mail ici. */
    CLOUD.signInPw = (email, password) => sb.auth.signInWithPassword({ email, password })
      .then(({ error }) => { if (error) throw error; });

    CLOUD.signUp = (email, password) => sb.auth.signUp({ email, password })
      .then(({ data, error }) => {
        if (error) throw error;
        if (!data.session) throw new Error("CONFIRMATION_REQUISE");
      });

    CLOUD.signOut = () => sb.auth.signOut();

    CLOUD.wipe = async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      const { error } = await sb.from("app_state").delete().eq("user_id", user.id);
      if (error) throw error;
    };

    /* Renvoie le contenu ET l'horodatage posé par Postgres (colonne updated_at,
       maintenue par un déclencheur côté base — voir supabase.sql). C'est ce
       repère, pas un horodatage écrit par le client, qui sert à l'arbitrage. */
    CLOUD.pull = async () => {
      const { data, error } = await sb.from("app_state").select("data, updated_at").maybeSingle();
      if (error) throw error;
      return data ? { payload: data.data, serverUpdatedAt: data.updated_at } : null;
    };

    /* Verrou optimiste : si on connaît la version qu'on a lue en dernier
       (knownUpdatedAt), on n'écrase que si elle n'a pas changé depuis —
       sinon quelqu'un d'autre a écrit entre-temps, et on le signale au lieu
       d'écraser son travail en silence. Sans repère connu (première synchro
       d'un appareil), on fait un upsert classique : rien à protéger encore. */
    CLOUD.push = async (payload, knownUpdatedAt) => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return { ok: false };
      if (knownUpdatedAt) {
        const { data, error } = await sb.from("app_state")
          .update({ data: payload })
          .eq("user_id", user.id)
          .eq("updated_at", knownUpdatedAt)
          .select("updated_at");
        if (error) throw error;
        if (data && data.length) return { ok: true, serverUpdatedAt: data[0].updated_at };
        return { ok: false, conflict: true };
      }
      const { data, error } = await sb.from("app_state")
        .upsert({ user_id: user.id, data: payload }, { onConflict: "user_id" })
        .select("updated_at");
      if (error) throw error;
      return { ok: true, serverUpdatedAt: data && data[0] ? data[0].updated_at : null };
    };

    sb.auth.onAuthStateChange((_e, session) => {
      CLOUD.user = session ? session.user : null;
      window.dispatchEvent(new Event("cloud-auth"));
    });

    const { data: { session } } = await sb.auth.getSession();
    CLOUD.user = session ? session.user : null;
  } catch (e) {
    CLOUD.enabled = false;
    console.warn("Cloud indisponible :", e);
  }
}
window.dispatchEvent(new Event("cloud-auth"));
</script>
</body>
